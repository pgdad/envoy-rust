name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # `toolchain:` is intentionally omitted so dtolnay reads
          # rust-toolchain.toml (D-3.9 pin, currently 1.95.0).

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: install h2spec
        run: |
          set -euo pipefail
          H2SPEC_VERSION="2.6.0"  # pinned; revisit at phase 06+
          curl -fsSL "https://github.com/summerwind/h2spec/releases/download/v${H2SPEC_VERSION}/h2spec_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          h2spec --version

      - name: test (includes differential harness → Docker)
        run: cargo test --workspace

      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  fuzz:
    name: fuzz (parse_bootstrap + jwt_parse, 30s each)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: cargo cache (fuzz subcrates)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/envoy-config/fuzz -> target
            crates/envoy-jwt/fuzz -> target

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: fuzz parse_bootstrap
        working-directory: crates/envoy-config
        # Use `+nightly` to override the workspace-root rust-toolchain.toml
        # (which pins stable 1.95.0); cargo-fuzz requires nightly for
        # -Zsanitizer and sancov flags.
        run: cargo +nightly fuzz run parse_bootstrap -- -max_total_time=30

      - name: fuzz jwt_parse
        working-directory: crates/envoy-jwt
        # Phase-22 §7.4 fuzz target over the JWKS/JWT parse + RS256-verify
        # surface (the envoy-jwt crate). Same `+nightly` rationale as above.
        run: cargo +nightly fuzz run jwt_parse -- -max_total_time=30
