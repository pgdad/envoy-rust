name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # `toolchain:` is intentionally omitted so dtolnay reads
          # rust-toolchain.toml (D-3.9 pin, currently 1.95.0).

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: install h2spec
        run: |
          set -euo pipefail
          H2SPEC_VERSION="2.6.0"  # pinned; revisit at phase 06+
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/summerwind/h2spec/releases/download/v${H2SPEC_VERSION}/h2spec_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          h2spec --version

      - name: pre-pull upstream Envoy image (Docker Hub flake guard)
        run: |
          set -euo pipefail
          # Tag is greped from the harness source so CI can never drift from
          # tests/differential/src/upstream.rs (IMAGE_TAG).
          TAG="$(grep -oP 'IMAGE_TAG: &str = "\K[^"]+' tests/differential/src/upstream.rs)"
          IMG="envoyproxy/envoy:${TAG}"
          for i in 1 2 3 4 5; do
            if docker pull "$IMG"; then exit 0; fi
            echo "docker pull $IMG failed (attempt $i); sleeping $((i*10))s"
            sleep $((i*10))
          done
          echo "giving up after 5 attempts"
          exit 1

      - name: test (includes differential harness → Docker)
        run: cargo test --workspace

      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  fuzz:
    name: fuzz (parse_bootstrap + jwt_parse + cdn_loop_parse + accesslog_format_parse, 30s each)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: cargo cache (fuzz subcrates)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/envoy-config/fuzz -> target
            crates/envoy-jwt/fuzz -> target
            crates/envoy-filter/fuzz -> target
            crates/envoy-accesslog/fuzz -> target

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: fuzz parse_bootstrap
        working-directory: crates/envoy-config
        # Use `+nightly` to override the workspace-root rust-toolchain.toml
        # (which pins stable 1.95.0); cargo-fuzz requires nightly for
        # -Zsanitizer and sancov flags.
        run: cargo +nightly fuzz run parse_bootstrap -- -max_total_time=30

      - name: fuzz jwt_parse
        working-directory: crates/envoy-jwt
        # Phase-22 §7.4 fuzz target over the JWKS/JWT parse + RS256-verify
        # surface (the envoy-jwt crate). Same `+nightly` rationale as above.
        run: cargo +nightly fuzz run jwt_parse -- -max_total_time=30

      - name: fuzz cdn_loop_parse
        working-directory: crates/envoy-filter
        # Phase-31 §7.4 fuzz target over the RFC 8586 CDN-Loop header parser
        # (`parse_cdn_loop` in the envoy-filter crate; the multi-header
        # coalescing surface). Same `+nightly` rationale as above.
        run: cargo +nightly fuzz run cdn_loop_parse -- -max_total_time=30

      - name: fuzz accesslog_format_parse
        working-directory: crates/envoy-accesslog
        # Phase-32 §7.4 fuzz target over the access-log command-operator
        # format-string parser (`parse_format` in the envoy-accesslog crate).
        # Same `+nightly` rationale as above.
        run: cargo +nightly fuzz run accesslog_format_parse -- -max_total_time=30
