[package]
name = "envoy-filter-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Prevent Cargo from treating this subcrate as part of the parent workspace.
# cargo-fuzz invokes cargo with `--manifest-path` pointing here; without an
# explicit empty `[workspace]`, cargo would walk up to the root Cargo.toml and
# error even though that root has `exclude = ["crates/envoy-filter/fuzz"]`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
envoy-filter = { path = ".." }

[[bin]]
name = "cdn_loop_parse"
path = "fuzz_targets/cdn_loop_parse.rs"
test = false
doc = false
bench = false
