static_resources:
  listeners: []
  clusters:
    - name: tcp_hc_backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      health_checks:
        - timeout: 1s
          interval: 1s
          healthy_threshold: 1
          unhealthy_threshold: 2
          tcp_health_check:
            send: { text: "000102" }
            receive:
              - { text: "0304" }
              - { binary: "AAECAw==" }
      load_assignment:
        cluster_name: tcp_hc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: localhost
                      port_value: 7000
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
