static_resources:
  listeners:
    - name: rbac_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.rbac
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
                stat_prefix: rbac_cidr_probe
                rules:
                  action: ALLOW
                  policies:
                    p0:
                      permissions:
                        - destination_ip: { address_prefix: 127.0.0.0, prefix_len: 8 }
                        - destination_port: 10000
                      principals:
                        - or_ids:
                            ids:
                              - direct_remote_ip: { address_prefix: 10.0.0.0, prefix_len: 8 }
                              - remote_ip: { address_prefix: 192.168.0.0, prefix_len: 16 }
                              - source_ip: { address_prefix: 172.16.0.0, prefix_len: 12 }
            - name: envoy.filters.network.echo
