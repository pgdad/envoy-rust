# 20 Task 9: fuzz seed for the HCM rds schema surface. parse_bootstrap parses +
# validates the SCHEMA only — it NEVER reads the referenced RDS file (the file
# load is load_dynamic_resources, a separate entry point the fuzz target does
# not call). The exactly-one-of check passes (rds present, route_config absent);
# the route-cluster validation defers while rds is configured-but-unloaded.
# Mirrors dynamic_resources_cds/lds.yaml.
node: { id: seed, cluster: seed }
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }
static_resources:
  clusters:
    - name: static_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: static_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8124 }
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 127.0.0.1, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http1
                codec_type: HTTP1
                rds:
                  route_config_name: local_route
                  config_source:
                    resource_api_version: V3
                    path_config_source: { path: /etc/envoy-rds/rds.yaml }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
