[package]
name = "envoy-jwt"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "envoy_jwt"
path = "src/lib.rs"

[dependencies]
aws-lc-rs = "1.16"          # PublicKeyComponents::verify — default features suffice (ADR-0055/0056 L1)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# RS256 test-token signing in unit tests is done via aws-lc-rs's signing API.
