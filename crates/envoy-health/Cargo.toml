[package]
name = "envoy-health"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "envoy_health"
path = "src/lib.rs"

[dependencies]
envoy-cluster = { path = "../envoy-cluster" }
envoy-config = { path = "../envoy-config" }
envoy-http1 = { path = "../envoy-http1" }
envoy-http2 = { path = "../envoy-http2" }
envoy-stats = { path = "../envoy-stats" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
# 69 §5.2 state-3 re-entry (I-1): a loopback `h2::server` in the `grpc_probe_once`
# verdict/timeout tests, mirroring the `envoy-http2::grpc` `call_serving_verdict`
# server body. Test-only — the product path reaches h2 via `envoy-http2`.
h2 = "0.4"
http = "1"
bytes = "1"
