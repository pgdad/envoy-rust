[package]
name = "envoy-http1"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
envoy-accesslog = { path = "../envoy-accesslog" }
envoy-config = { path = "../envoy-config" }
envoy-cluster = { path = "../envoy-cluster" }
envoy-filter = { path = "../envoy-filter" }
envoy-listener = { path = "../envoy-listener" }
envoy-stats = { path = "../envoy-stats" }
httparse = "1"
rustix = { version = "1", default-features = false, features = ["time"] }
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"

[features]
# EXPERIMENTAL: io_uring data-plane worker (Linux-only; see src/uring.rs).
# Off by default; even when compiled in, engagement requires ENVOY_RUST_URING=1.
uring = ["dep:monoio", "dep:socket2"]

[target.'cfg(target_os = "linux")'.dependencies]
monoio = { version = "0.2", optional = true }
socket2 = { version = "0.5", optional = true }

[dev-dependencies]
bytes = "1"
envoy-accesslog = { path = "../envoy-accesslog", features = ["test-util"] }
envoy-filter = { path = "../envoy-filter", features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tracing-subscriber = "0.3"
