[package]
name = "envoy-cluster"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "envoy_cluster"
path = "src/lib.rs"

[dependencies]
envoy-config = { path = "../envoy-config" }
envoy-stats = { path = "../envoy-stats" }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "macros", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
tokio-util = "0.7"
