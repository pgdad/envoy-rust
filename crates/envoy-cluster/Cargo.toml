[package]
name = "envoy-cluster"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "envoy_cluster"
path = "src/lib.rs"

[dependencies]
envoy-config = { path = "../envoy-config" }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
