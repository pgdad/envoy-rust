[package]
name = "differential"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "differential"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3"
testcontainers = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
