[package]
name = "helper-common"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "helper_common"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
