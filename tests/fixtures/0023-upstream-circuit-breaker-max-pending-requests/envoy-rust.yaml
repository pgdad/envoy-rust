# Phase 15 fixture-0023 (envoy-rust side). Binds 127.0.0.1 (not 0.0.0.0) per
# the host-subprocess shape; admin block included for the post-settle bilateral
# stat scrape on {{ADMIN_PORT}}. `generate_request_id` is omitted (envoy-rust's
# HCM config does not model it — see fixture 0020's envoy-rust.yaml). The
# circuit-breaker thresholds match the Envoy side exactly:
# `max_connections: 1, max_pending_requests: 0` (the no-queue reject carve-out,
# accepted by the Task-1 validator). envoy-rust rejects the cold connect-on-miss
# before the cap-check (pool acquire pending-gate, Task 2) -> the synth_overflow
# 503 (Task 4) + `cluster.backend_cluster.upstream_rq_pending_overflow: 1`,
# never contacting the backend (`upstream_cx_total: 0`).
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-15-cluster
  id: phase-15-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1
            max_pending_requests: 0
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
