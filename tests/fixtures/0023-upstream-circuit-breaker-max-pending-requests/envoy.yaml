# Phase 15 fixture-0023 (Envoy side): max_pending_requests:0 reject path
# (ADR-0043 §6.2 finding 1). A single GET against a cluster configured with
# `circuit_breakers.thresholds: [{ max_connections: 1, max_pending_requests: 0 }]`
# is rejected by Envoy BEFORE any upstream connection is established — the
# request needs a pending slot to wait for the connect, and with 0 slots it
# overflows immediately. Envoy returns a 503 with the byte-exact 81-byte
# "...reset reason: overflow" local-reply body + `x-envoy-overloaded: true`,
# increments `cluster.backend_cluster.upstream_rq_pending_overflow`, and never
# contacts the backend (`upstream_cx_total: 0`).
#
# Topology mirrors fixture 0020 (STRICT_DNS single endpoint, H1 HCM listener
# routing `/` -> backend_cluster, admin block) so the cross-proxy delta is
# isolated to the circuit-breaker thresholds. The backend is the fast 200
# configurable-status backend at {{BACKEND_HOST}}:{{BACKEND_PORT}}, but it is
# NEVER contacted under max_pending_requests:0 (the address must be a real,
# reachable endpoint matching 0020's pattern; its responses are irrelevant).
#
# Timing-robust: ONE GET, no concurrency, no slow backend (lock-in #11).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-15-cluster
  id: phase-15-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1
            max_pending_requests: 0
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
