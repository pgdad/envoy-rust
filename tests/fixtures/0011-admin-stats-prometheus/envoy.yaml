# Phase 06.1 fixture 0011 — admin stats Prometheus scrape (D6).
# 1 HCM listener serving direct_response 200 "ok\n" + 1 admin listener
# serving /ready /stats /stats/prometheus. Driver::AdminScrape drives
# `GET /` against the HCM listener (counters increment) then
# `GET /stats/prometheus` against the admin listener; the harness asserts
# metric-name-set equality between envoy ↔ envoy-rust modulo the
# allowlist_envoy_only entries seeded empirically per SPEC §6 signpost 12.
#
# request_headers_to_remove + generate_request_id: false suppress
# upstream-Envoy injections that envoy-rust does not emit, mirroring the
# 04.x / 05.x fixture precedent (matters for HCM-side counters that fire
# on header-rewrite; harmless here but kept for cross-fixture consistency).

node: { id: envoy-rust-phase-06.1-fixture-0011, cluster: envoy-rust-phase-06.1 }
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
static_resources:
  listeners:
    - name: ingress_http
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: local_route
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: backend_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
