driver:
  kind: admin_scrape
  pre_requests:
    - method: GET
      path: "/"
      host: envoy-rust.test
      port_key: PORT
  # 08.1 Task 11: Driver::AdminScrape widened to a list of sub-cases
  # (architecture-decision lock-in #13 forbids a new Driver variant;
  # fixture 0014 needs to scrape 4 admin endpoints in one fixture, so
  # the per-sub-case `path` / `expected_*` tuple moved into a dedicated
  # `AdminScrapeCase` struct). Fixture 0011 migrated in lockstep with
  # no semantic change — a single-element `scrapes:` list.
  scrapes:
    - path: "/stats/prometheus"
      expected_status: 200
      # Empirically verified at task-execution time: upstream Envoy 1.33.0
      # emits `text/plain; charset=UTF-8` for `/stats/prometheus` (NOT the
      # Prometheus-spec `text/plain; version=0.0.4; charset=utf-8`).
      # envoy-rust mirrors verbatim per D-3.3
      # (envoy-admin/src/endpoint.rs landed the product-side change in
      # 06.1 Task 12; see PROGRESS.md).
      expected_content_type: "text/plain; charset=UTF-8"
      expected_body_rule:
        kind: prometheus_exposition
        # Empirically seeded per SPEC §6 signpost 12 from the first failing
        # run's `envoy-only` diff. Total: 204 entries. Categories (counts in
        # parens; see README.md for the doctrine reasons):
        #   - server.* (29) — server-state stats not yet ported.
        #   - http.downstream.* (60) — HCM stats beyond downstream_rq_total.
        #   - listener.* (22) + listener.admin.* (22) — auto-emitted listener
        #     stats for the HCM and admin listeners.
        #   - listener_manager.* (12) — listener manager book-keeping.
        #   - cluster_manager.* (9) — cluster manager book-keeping.
        #   - runtime.* (9) — RTDS runtime layer (defers to xDS family).
        #   - filesystem.* (6) — file I/O stats.
        #   - http.tracing.* (5), http.passthrough.* (5), http.rq.* (5),
        #     http1.* (4), http.no_*/rs.* (3) — HCM-adjacent counters.
        #   - overload.* (3), main_thread.* (2), workers.* (2),
        #     listener_worker.* (2), thread_local.* (2), tcmalloc.* (1) —
        #     runtime-overload bookkeeping.
        #   - envoy.envoy_overload_actions_reset_high_memory_stream_count (1)
        #     — anomalous double-`envoy_` prefix emitted by upstream Envoy.
        # Sorted alphabetically for diff-readability under future churn.
        value_exact: []
        # Bilateral value_exact assertions on per-class HCM counters, listener
        # cx_total, etc. defer to a later phase that ships a StatsTagExtractor-
        # equivalent. Upstream Envoy emits these counters under
        # `envoy_http_downstream_rq_total{envoy_http_conn_manager_prefix="ingress_http"}`
        # (label-keyed) while envoy-rust emits
        # `envoy_http_ingress_http_downstream_rq_total` (name-embedded) — see the
        # `allowlist_envoy_rust_only` block below + BEHAVIOR_CONTRACT.md
        # "Prometheus exposition shape divergence". When the dynamic segment is
        # projected back to a label at scrape time, the paired allow-list entries
        # drop together AND bilateral value_exact assertions become possible.
        # Until then, value-side verification stays at the unit-test level
        # (Tasks 4 / 5 / 6 / 7 / 8 / 10 each carry per-stat unit tests).
        value_must_be_zero: []
        value_present_only: []
        allowlist_envoy_only:
