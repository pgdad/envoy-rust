        # The presence of these 2 names is intentional and paired with the
        # corresponding `envoy_http_downstream_rq_total` /
        # `envoy_listener_downstream_cx_total` entries on the envoy-only side:
        # both proxies emit the same counter; the Prometheus name-vs-label
        # shape differs. See BEHAVIOR_CONTRACT.md "Stat name mapping" §06.1.
        # When a `StatsTagExtractor`-equivalent lands and projects the
        # dynamic segment into a label, both lists drop these entries together.
        allowlist_envoy_rust_only:
          - envoy_http_ingress_http_downstream_rq_total
          # 06.3 D15.3.a: per-response-class HCM counters. Envoy emits these
          # as `envoy_http_downstream_rq_xx` (generic) with a label-keyed tag
          # approach; envoy-rust embeds the stat_prefix in the name per its
          # current StatsRegistry convention (no label/tag extraction yet).
          # Both entries (downstream_rq_xx on the envoy-only side and these
          # four name-embedded variants on the envoy-rust-only side) will drop
          # together when a StatsTagExtractor-equivalent lands.
          - envoy_http_ingress_http_downstream_rq_2xx
          - envoy_http_ingress_http_downstream_rq_3xx
          - envoy_http_ingress_http_downstream_rq_4xx
          - envoy_http_ingress_http_downstream_rq_5xx
          - envoy_listener_ingress_http_downstream_cx_total
          # 06.3 D15.3.b: per-listener active-connection gauge. Envoy emits this
          # as `envoy_listener_downstream_cx_active` (generic, with label-based
          # listener naming); envoy-rust embeds the listener name in the stat name
          # per its current StatsRegistry convention. Will drop together with
          # `downstream_cx_total` when a StatsTagExtractor-equivalent lands.
          - envoy_listener_ingress_http_downstream_cx_active
          # 06.3 D15.3.b: per-cluster active-connection gauge. Envoy emits this
          # as `envoy_cluster_backend_upstream_cx_active` (with label-based
          # cluster naming); envoy-rust embeds the cluster name in the stat name
          # per its current StatsRegistry convention. Will drop together with
          # `upstream_cx_total` when a StatsTagExtractor-equivalent lands.
          - envoy_cluster_backend_upstream_cx_active
          # 06.3 D15.3.c: per-cluster upstream-response counters. Envoy emits
          # these as `envoy_cluster_backend_upstream_rq_total` and
          # `envoy_cluster_backend_upstream_rq_5xx` with label-based cluster
          # naming; envoy-rust embeds the cluster name in the stat name. Will
          # drop together with the other cluster counters when a
          # StatsTagExtractor-equivalent lands.
          - envoy_cluster_backend_upstream_rq_total
          - envoy_cluster_backend_upstream_rq_5xx
          # 06.3 D15.3.d: per-listener accept-failure counter. Envoy emits this
          # as `envoy_listener_downstream_cx_overflow`-adjacent (no direct upstream
          # Envoy equivalent for accept-OS-error; the closest upstream stat lives
          # under listener manager). envoy-rust embeds the listener name in the stat
          # name per the current StatsRegistry convention. Holding-pattern entry;
          # Task 11's territory for BEHAVIOR_CONTRACT update.
          - envoy_listener_ingress_http_downstream_cx_accept_failed
          # 06.3 D15.3.e: access-log emission counters. Envoy does not expose
          # these counters in its Prometheus stats; envoy-rust emits them with
          # the stat_prefix embedded in the name per the current StatsRegistry
          # convention. Holding-pattern entry; BEHAVIOR_CONTRACT update is
          # Task 11's territory.
          - envoy_http_ingress_http_access_logs_total
          - envoy_http_ingress_http_access_logs_failed
