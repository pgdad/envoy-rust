# Phase 14.2 D8.1 differential fixture: assert consecutive-5xx passive
# outlier-detection ejection on an H1 listener.
#
# Topology:
#   - downstream: HTTP/1.1 listener on {{PORT}}; admin on {{ADMIN_PORT}}.
#   - upstream  : configurable-status backend at {{BACKEND_HOST}}:{{BACKEND_PORT}}.
#                 200 default; /fail -> 500 ("server error\n", 13 bytes) via
#                 the harness `--per-path /fail=500` flag.
#   - cluster   : backend_cluster, STRICT_DNS, single endpoint.
#                 outlier_detection consecutive_5xx: 3, base_ejection_time 60s,
#                 max_ejection_percent 100, interval 1s. Panic disabled
#                 (healthy_panic_threshold: { value: 0 }) so an ejected
#                 endpoint stays out of the pick set.
#
# Driver: `http1_keep_alive` (13.1 D10; extended at 14.2 Task 6 with per-
# request expected_body / require_header_present / require_header_absent).
# ONE downstream keep-alive conn issues 4 sequential GET /fail:
#   reqs 1-3: backend 500 (consecutive_5xx counter 1 -> 2 -> 3 == threshold
#             -> the sole endpoint ejects on request 3).
#   req 4   : no healthy endpoint -> 12.2 no-healthy-upstream synth-503
#             ("no healthy upstream", 19 bytes).
#
# Integer-second durations per parent §6.2 item-6 (both proxies' duration
# parsers accept `1s`/`60s` only).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-14-cluster
  id: phase-14-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/fail" }
                          route: { cluster: backend_cluster }
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      outlier_detection:
        consecutive_5xx: 3
        base_ejection_time: 60s
        max_ejection_percent: 100
        interval: 1s
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
