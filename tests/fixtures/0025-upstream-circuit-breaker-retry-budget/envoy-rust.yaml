# Phase 17 fixture-0025 (envoy-rust side). Binds 127.0.0.1 (not 0.0.0.0) per the
# host-subprocess shape; admin block included for the post-settle bilateral stat
# scrape on {{ADMIN_PORT}}. `generate_request_id` is omitted (envoy-rust's HCM
# config does not model it — see fixtures 0020/0023/0024). The three clusters'
# circuit-breaker thresholds match the Envoy side exactly:
#   budget_zero    : max_retries:0 + track_remaining:true  (retry-budget gate,
#                    Task 4) -> the policy's retry is blocked,
#                    `upstream_rq_retry_overflow` ticks, attempt-1 503 returned
#                    verbatim, x-envoy-attempt-count: 1.
#   budget_default : track_remaining:true, no caps (defaults 3/1024) -> the
#                    within-cap retry proceeds (L10 control),
#                    `upstream_rq_retry_success` ticks, 200 "ok\n",
#                    x-envoy-attempt-count: 2.
#   rq_zero        : max_requests:0 (request-budget gate, Task 5) -> the request
#                    is rejected before any upstream connect, synth_overflow 503
#                    + `x-envoy-overloaded`, `upstream_rq_pending_overflow` ticks
#                    (and `upstream_rq_5xx` per ADR-0047 L3), backend never
#                    contacted, x-envoy-attempt-count: 1.
# The retry policy + `include_attempt_count_in_response: true` match the Envoy
# side exactly; envoy-rust's YAML parser uses the same v3 field names.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-17-cluster
  id: phase-17-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      include_attempt_count_in_response: true
                      routes:
                        - match: { prefix: "/budget-blocked" }
                          route:
                            cluster: budget_zero
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                        - match: { prefix: "/budget-allowed" }
                          route:
                            cluster: budget_default
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                        - match: { prefix: "/rq-blocked" }
                          route: { cluster: rq_zero }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: budget_zero
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_retries: 0
            track_remaining: true
      load_assignment:
        cluster_name: budget_zero
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
    - name: budget_default
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            track_remaining: true
      load_assignment:
        cluster_name: budget_default
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
    - name: rq_zero
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_requests: 0
      load_assignment:
        cluster_name: rq_zero
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
