# Phase 17 fixture-0025 (Envoy side): circuit-breaker retry/request budget
# differential (ADR-0046 SPEC / ADR-0047 PLAN). Three sequential GETs over ONE
# H1 keep-alive conn exercise the three budget outcomes against three
# single-endpoint STRICT_DNS clusters that all point at the SAME stateful
# backend host:port:
#
#   GET /budget-blocked (cluster budget_zero, max_retries:0 + retry_on 5xx
#       num_retries:1) : attempt 1 -> backend 503 ("service unavailable\n", 20
#       bytes). The retry the policy would dispatch is BLOCKED by the
#       max_retries:0 budget -> `upstream_rq_retry_overflow` ticks, the
#       attempt-1 503 is returned verbatim, x-envoy-attempt-count: 1 (no retry
#       attempt was made). NO `x-envoy-overloaded` (the response is a real
#       upstream 503, not a synth local-reply).
#   GET /budget-allowed (cluster budget_default, default budgets 3/1024 +
#       retry_on 5xx num_retries:1) : attempt 1 -> backend 503 ("fail\n"); the
#       retry budget admits the retry and attempt 2 -> backend 200 ("ok\n").
#       Final 200, body "ok\n", x-envoy-attempt-count: 2,
#       `upstream_rq_retry_success` ticks. This is the L10 control showing the
#       budget gate does NOT block a within-cap retry.
#   GET /rq-blocked (cluster rq_zero, max_requests:0, NO retry_policy) : the
#       request-budget gate rejects the request BEFORE any upstream connection
#       (it needs a request slot and there are 0). Envoy returns the byte-exact
#       "...reset reason: overflow" local-reply 503 + `x-envoy-overloaded: true`,
#       `upstream_rq_pending_overflow` ticks, x-envoy-attempt-count: 1, the
#       backend is never contacted.
#
# The virtual host sets `include_attempt_count_in_response: true` (L11) so the
# final response carries `x-envoy-attempt-count`. Topology mirrors fixtures
# 0023/0024 (STRICT_DNS single endpoints, H1 HCM listener, admin block) so the
# cross-proxy delta is isolated to the budget thresholds. All three clusters set
# `dns_lookup_family: V4_ONLY` (L11, the macOS Docker IPv6 trap). The backend is
# the health-aware-http1-backend at {{BACKEND_HOST}}:{{BACKEND_PORT}}, started by
# the harness with `--per-path /budget-blocked=503 --retry-script
# /budget-allowed=fail:1` (keyed on the fixture directory name). The retry-script
# counter is a single global per-path cyclic window (fail:1 -> 503,200,503,
# 200,...; NOT source-IP keyed — macOS Docker Desktop NATs container source IPs
# to 127.0.0.1). The harness drives the two proxies sequentially, so each
# proxy's /budget-allowed retry pair lands in its own fresh window and observes
# the same fail-then-succeed sequence over the shared backend.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-17-cluster
  id: phase-17-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      include_attempt_count_in_response: true
                      routes:
                        - match: { prefix: "/budget-blocked" }
                          route:
                            cluster: budget_zero
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                        - match: { prefix: "/budget-allowed" }
                          route:
                            cluster: budget_default
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                        - match: { prefix: "/rq-blocked" }
                          route: { cluster: rq_zero }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: budget_zero
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_retries: 0
            track_remaining: true
      load_assignment:
        cluster_name: budget_zero
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
    - name: budget_default
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            track_remaining: true
      load_assignment:
        cluster_name: budget_default
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
    - name: rq_zero
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_requests: 0
      load_assignment:
        cluster_name: rq_zero
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
