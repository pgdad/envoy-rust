# Phase 68 differential acceptance fixture: assert post-convergence active
# TCP-HC steady state on an H1 listener.
#
# Topology:
#   - downstream: HTTP/1.1 listener on {{PORT}} -> HCM -> router -> cluster `tcp_hc_backend`
#   - upstream  : NO backend — {{DEAD_BACKEND_PORT}} is a reserved-but-unbound
#                 port, so the TCP HC probe gets ECONNREFUSED every tick
#   - cluster   : active connection-only TCP HC every 1s, `unhealthy_threshold: 2`,
#                 panic disabled (`healthy_panic_threshold: { value: 0 }`)
#
# After ~3.5 s + margin both proxies converge: the sole endpoint is ejected
# (connect refused -> failure -> Unhealthy after 2 consecutive) -> `pick() ->
# None` -> synth-503 with body `no healthy upstream` (19 bytes, ADR-0037).
# Driver: `Driver::Http1AfterSettle` (settle 3500 ms, then GET /).
#
# Same downstream observable as fixture 0019 (the HTTP-HC ejection), but the
# failure is driven by a connection-only `tcp_health_check` (ADR-0136/0137).
# Integer-second durations per §6.2 item-6.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-68-cluster
  id: phase-68-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: tcp_hc_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: tcp_hc_backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      health_checks:
        - timeout: 1s
          interval: 1s
          healthy_threshold: 1
          unhealthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: tcp_hc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{DEAD_BACKEND_PORT}}
