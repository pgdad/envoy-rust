# envoy-rust side. Connection-only TCP health check against a REFUSED port
# ({{DEAD_BACKEND_PORT}} has no listener) → after settle the sole endpoint is
# Unhealthy → pick() None → synth-503. Mirrors fixture 0019 (ADR-0137 PV-2).
# No admin block; bind 127.0.0.1; no generate_request_id (envoy-rust's HCM
# config does not model it).
node:
  cluster: phase-68-cluster
  id: phase-68-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: tcp_hc_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: tcp_hc_backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      health_checks:
        - timeout: 1s
          interval: 1s
          healthy_threshold: 1
          unhealthy_threshold: 2
          tcp_health_check: {}
      load_assignment:
        cluster_name: tcp_hc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{DEAD_BACKEND_PORT}}
