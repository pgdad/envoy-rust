# Phase 16 fixture-0024 (Envoy side): HTTP retry-on-5xx differential
# (ADR-0044/ADR-0045). Two sequential GETs over ONE H1 keep-alive conn exercise
# the two retry outcomes of a `retry_policy: {retry_on: "5xx", num_retries: 1}`
# route against a single-endpoint STRICT_DNS cluster `backend`:
#
#   GET /retry-success  : the stateful retry-script backend serves 503 ("fail\n")
#                         on attempt 1 then 200 ("ok\n") on the retry → final
#                         200, `upstream_rq_retry_success` ticks (L4).
#   GET /retry-exhausted: the stateless per-path backend serves 503
#                         ("service unavailable\n", 20 bytes) on every attempt →
#                         the single retry is consumed and the LAST upstream 503
#                         is returned verbatim, `upstream_rq_retry_limit_exceeded`
#                         ticks (L9).
#
# Both routes carry `retry_policy: {retry_on: "5xx", num_retries: 1}`; the
# virtual host sets `include_attempt_count_in_response: true` (L6) so the final
# response on BOTH paths carries `x-envoy-attempt-count: 2` (2 attempts each).
#
# Topology mirrors fixtures 0020/0022/0023 (STRICT_DNS single endpoint, H1 HCM
# listener, admin block) so the cross-proxy delta is isolated to the retry
# policy. The cluster sets `dns_lookup_family: V4_ONLY` (L11, the macOS Docker
# IPv6 trap). The backend is the health-aware-http1-backend at
# {{BACKEND_HOST}}:{{BACKEND_PORT}}, started by the harness with
# `--retry-script /retry-success=fail:1 --per-path /retry-exhausted=503` (keyed
# on the fixture directory name); the retry-script counter is a single global
# per-path cyclic window (fail:1 -> 503,200,503,200,...; NOT source-IP keyed —
# macOS Docker Desktop NATs container source IPs to 127.0.0.1). Because the
# harness drives the two proxies sequentially and each proxy's two upstream
# attempts are consecutive, each proxy's retry pair lands in its own fresh
# window and sees the same fail-then-succeed sequence over the shared backend.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-16-cluster
  id: phase-16-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      include_attempt_count_in_response: true
                      routes:
                        - match: { prefix: "/retry-success" }
                          route:
                            cluster: backend
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                        - match: { prefix: "/retry-exhausted" }
                          route:
                            cluster: backend
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
