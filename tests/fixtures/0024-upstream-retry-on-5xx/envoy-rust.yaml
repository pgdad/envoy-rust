# Phase 16 fixture-0024 (envoy-rust side). Binds 127.0.0.1 (not 0.0.0.0) per
# the host-subprocess shape; admin block included for the post-settle bilateral
# stat scrape on {{ADMIN_PORT}}. `generate_request_id` is omitted (envoy-rust's
# HCM config does not model it — see fixture 0020/0023). The retry policy and
# `include_attempt_count_in_response: true` match the Envoy side exactly;
# envoy-rust's YAML parser uses the same field names (the schema was built to
# match the v3 API). The H1 retry loop (Task 4) drives the per-attempt
# `upstream_rq_total`, the completing-only `upstream_rq_5xx`, the
# `upstream_rq_retry{,_success,_limit_exceeded}` counters (Task 3), and the
# `x-envoy-attempt-count: 2` response header (Task 4, gated on the vhost flag).
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-16-cluster
  id: phase-16-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      include_attempt_count_in_response: true
                      routes:
                        - match: { prefix: "/retry-success" }
                          route:
                            cluster: backend
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                        - match: { prefix: "/retry-exhausted" }
                          route:
                            cluster: backend
                            retry_policy: { retry_on: "5xx", num_retries: 1 }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
