# Phase-23 envoy-rust counterpart. Identical HCM shape modulo bind address
# (127.0.0.1 for envoy-rust per the fixture-0017 precedent) and the absent
# admin block (envoy-rust harness does not probe admin for this fixture). The
# {{PORT}} token is substituted by the harness.
#
# Per-side YAML asymmetry from upstream envoy.yaml:
#   - No admin block (envoy-rust parser/harness does not use it).
#   - bind 127.0.0.1:{{PORT}} instead of 0.0.0.0:{{PORT}}.
#   - No generate_request_id field (envoy-rust's HCM config does not model it;
#     envoy-rust does not inject x-request-id by default — no-op divergence).
#   - No request_headers_to_remove field (envoy-rust does not inject the Envoy
#     header suite, so stripping is a no-op; the parser rejects unknown fields).
#   - Cluster: {{BACKEND_HOST}} = 127.0.0.1 (host-local); no dns_lookup_family
#     (envoy-rust's cluster config does not model it).
#
# The HCM body — http_filters list, route_config, stat_prefix, codec_type,
# typed_per_filter_config (the CorsPolicy) — is otherwise identical to envoy.yaml.
# References: ADR-0057 (phase-23 SPEC), ADR-0058 (phase-23 PLAN-write).
node:
  cluster: phase-23-cluster
  id: phase-23-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - exact: "http://allowed.example.com"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "x-custom-header, content-type"
                              max_age: "3600"
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} } }
