# Phase-23 differential acceptance fixture: drive 4 sequential HTTP/1.1 requests
# through an HCM whose http_filters chain is
#   [envoy.filters.http.cors, envoy.filters.http.router]
# with a CorsPolicy attached via typed_per_filter_config to the single prefix "/"
# route (which proxies to a real http1-echo-server upstream cluster — per the
# L6 lock-in in ADR-0058: Envoy's CORS filter does NOT engage on direct_response
# routes; a real upstream cluster is MANDATORY). Probes exercise all four
# §6.2-verified CORS behaviours:
#   1. Preflight   — OPTIONS + allowed origin + ACRM → 200, empty body, CORS headers
#   2. Actual GET  — GET + allowed origin → 200, echo body, access-control-allow-origin
#   3. Evil origin — GET + disallowed origin → 200, echo body, NO access-control-*
#   4. No origin   — GET (no Origin) → 200, echo body, NO access-control-*
#
# CORS policy attached to the route via typed_per_filter_config:
#   allow_origin_string_match: [exact: "http://allowed.example.com"]
#   allow_methods: "GET, POST, OPTIONS"
#   allow_headers: "x-custom-header, content-type"
#   max_age: "3600"
#
# Per-side YAML asymmetry follows the fixture-0008/0017 precedent:
#   - upstream side: admin block (port 0; kernel-ephemeral); bind
#     0.0.0.0:{{PORT}} (Docker container public bind);
#     generate_request_id: false (envoy-rust does not inject x-request-id);
#     request_headers_to_remove stripping the Envoy-injected upstream headers
#     (x-forwarded-for, x-forwarded-proto, x-request-id, etc.) so the
#     echo-server body is byte-equal across both proxies.
#   - envoy-rust side: no admin block; bind 127.0.0.1:{{PORT}}; neither
#     generate_request_id nor request_headers_to_remove (envoy-rust does not
#     inject those headers, so stripping is a no-op).
#
# Filter-chain entry: type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
# (the near-empty filter-chain config, §6.2-verified L1 — Envoy v1.33 + envoy-rust
# both accept this @type). The actual CorsPolicy lives per-route in
# typed_per_filter_config (also §6.2-verified L1).
#
# Cluster shape: STRICT_DNS, dns_lookup_family: V4_ONLY (per 0008/0030);
#   upstream side: {{BACKEND_HOST}} = host.docker.internal (Docker → Mac host);
#   subject side:  {{BACKEND_HOST}} = 127.0.0.1.
# References: ADR-0057 (phase-23 SPEC), ADR-0058 (phase-23 PLAN-write).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-23-cluster
  id: phase-23-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - exact: "http://allowed.example.com"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "x-custom-header, content-type"
                              max_age: "3600"
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} } }
