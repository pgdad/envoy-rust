# Phase 08.2 fixture 0015 — admin /drain_listeners end-to-end (D17.2).
# Mirrors fixture 0007's HCM + direct_response bootstrap shape (minimal
# data-plane surface — no STRICT_DNS cluster, no backend) so the
# Driver::AdminScrape post_admin_assertions step has a real data-plane
# listener to probe for ECONNREFUSED / immediate-EOF after the
# /drain_listeners POST flips DrainState to Draining.
#
# Sequence (Driver::AdminScrape; temporal order driven by Task 7's
# dispatch arm regardless of YAML field order):
#   1. pre_requests:        GET /ready → 200 "LIVE\n" (pre-drain baseline)
#   2. pre_admin_actions:   POST /drain_listeners → 200 (the drain trigger)
#   3. scrapes:             GET /ready → 503 "DRAINING\n" (post-drain state)
#   4. post_admin_assertions: data_plane_connection_refused on the HCM
#      listener → ECONNREFUSED OR immediate-EOF within 5s budget
#      (wire-level drain effect).
#
# Admin listener stays serving during drain per parent-08 SPEC §5.5
# (operator reachability invariant).

node: { id: envoy-rust-phase-08.2-fixture-0015, cluster: envoy-rust-phase-08.2 }
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
static_resources:
  listeners:
    - name: hcm_listener
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: local_route
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
