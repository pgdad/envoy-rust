# Phase 08.2 fixture 0015 — admin /drain_listeners end-to-end (D17.2).
# Mirrors fixture 0007's HCM + direct_response bootstrap shape (minimal
# data-plane surface — no STRICT_DNS cluster, no backend) so the
# Driver::AdminScrape post_admin_assertions step has a real data-plane
# listener to probe for ECONNREFUSED / immediate-EOF after the
# /drain_listeners POST flips DrainState to Draining.
#
# Sequence (Driver::AdminScrape; temporal order driven by Task 7's
# dispatch arm regardless of YAML field order; pre_requests omitted —
# see expectations.yaml "No pre_requests" docstring + fixture README
# "Why no pre_requests" section):
#   1. pre_admin_actions:   POST /drain_listeners → 200 (the drain trigger).
#   2. scrapes:             GET /server_info → 200 application/json with
#      required `state` key whose VALUE is permitted to differ across
#      proxies (empirical pivot from PLAN-sketched /ready scrape;
#      upstream Envoy v1.33's /ready does NOT flip to 503 on POST
#      /drain_listeners without --drain-strategy immediate CLI flag —
#      see expectations.yaml inline rationale at the scrapes block).
#   3. post_admin_assertions: data_plane_connection_refused on the HCM
#      listener → ECONNREFUSED OR immediate-EOF OR RST within 5s budget
#      (wire-level drain effect — bilateral invariant per
#      BEHAVIOR_CONTRACT.md "Admin-action effect equivalence").
#
# Admin listener stays serving during drain per parent-08 SPEC §5.5
# (operator reachability invariant).

node: { id: envoy-rust-phase-08.2-fixture-0015, cluster: envoy-rust-phase-08.2 }
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
static_resources:
  listeners:
    - name: hcm_listener
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: local_route
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
