# Phase 22 envoy-rust counterpart. Identical HCM shape modulo bind address
# (127.0.0.1 for envoy-rust per the fixture-0017 precedent) and the absent
# admin block (envoy-rust harness does not probe admin for direct_response
# fixtures). The {{PORT}} token is substituted by the harness. The
# static_resources HCM body is identical to the upstream side: same
# http_filters list ([envoy.filters.http.jwt_authn with provider1 +
# the single prefix "/" rule, envoy.filters.http.router]), same route_config
# (single direct_response {status: 200, body: "ok\n"}), same
# stat_prefix: ingress_http, same codec_type: HTTP1, clusters: [].
#
# The inline JWKS string is BYTE-IDENTICAL to the upstream envoy.yaml and to
# inputs/jwks.json. envoy-rust's HCM config omits `generate_request_id`
# (its config does not model it and rejects unknown fields); envoy-rust does
# not inject x-request-id by default so this is a no-op divergence.
node:
  cluster: phase-22-cluster
  id: phase-22-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        provider1:
                          issuer: "testing@secure.istio.io"
                          audiences: ["jwt-fixture-aud"]
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"RSA","kid":"k1","use":"sig","alg":"RS256","n":"rF6xHfq-E5a7xDgXOzQbUxVjiB-t-Ot2L5kOg1VZPEDZ7xh2WSnqTlzojuHpJecoiimQ-4Wu9GAM0SEWaedUypbVsWNAaDLaeNA4j9IpGcl2L5Q1EI4qA3hPpi21KRdQnv3chnAb5M9uLBwZoXfDaOTD_SqrE846LR0GOFsV_mSwHEa9Nb6aP2y_DXetyyL2i3a7OXFF-IP-35zOIorWlswnomCwnbn2YlJYTi6SvDtxwvgC3AtdzO3SFHndRT71DrRapLV0tZT0GOF9PkbsTh_E1ooqCLMXt4z4dgVKcjk4prKQ2aaeoY5qeXMEzJmzE5x8YUm30DMjdlUJFJahAQ","e":"AQAB"}]}'
                      rules:
                        - match: { prefix: "/" }
                          requires: { provider_name: "provider1" }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
