# Phase 22 differential acceptance fixture: drive 5 sequential GET / requests
# through an HCM whose http_filters chain is
#   [envoy.filters.http.jwt_authn, envoy.filters.http.router]
# with a single provider `provider1` (issuer testing@secure.istio.io,
# audiences [jwt-fixture-aud], inline RSA-2048 JWKS kid k1) required on the
# prefix "/" route. Probes exercise the 200 / 401 / 403 verdicts:
#   1. valid          — 200 / "ok\n"                          (verify OK)
#   2. missing         — 401 / "Jwt is missing"               (no Authorization)
#   3. tampered        — 401 / "Jwt verification fails"       (bad signature)
#   4. expired         — 401 / "Jwt is expired"               (exp in 2017)
#   5. wrong-audience  — 403 / "Audiences in Jwt are not allowed"
#
# The 4 .jwt tokens + the inline JWKS were generated ONCE by
# inputs/gen.sh (openssl RSA-2048 keygen + RS256 signing; python3 stdlib
# base64url) and are committed static. `exp` is far-future (year 2100) or
# far-past (year 2017) so there is ZERO clock sensitivity cross-proxy.
#
# Per upstream Envoy v1.33's
# envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication, the local
# replies are byte-exact: status + body text per the verdict above, plus a
# `www-authenticate: Bearer realm="http://{Host}{path}"` header (with a
# `, error="invalid_token"` suffix on every non-missing failure). Because
# both proxies receive the SAME `Host: envoy.test` + path `/`, the realm
# `http://envoy.test/` is identical on both sides → the www-authenticate
# value is byte-exact cross-proxy and is NOT on the harness allow-list
# (§6.2 L3 lock).
#
# Per-side YAML asymmetry follows the fixture-0017 precedent:
#   - upstream side: admin block (port 0; kernel-ephemeral); bind
#     0.0.0.0:{{PORT}} (Docker container public bind);
#     generate_request_id: false (envoy-rust does not inject x-request-id,
#     so disable upstream injection for header-set parity).
#   - envoy-rust side: no admin block; bind 127.0.0.1:{{PORT}}.
# References: ADR-0055 (phase-22 SPEC; new envoy-jwt crate),
#             ADR-0056 (phase-22 PLAN).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-22-cluster
  id: phase-22-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        provider1:
                          issuer: "testing@secure.istio.io"
                          audiences: ["jwt-fixture-aud"]
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"RSA","kid":"k1","use":"sig","alg":"RS256","n":"rF6xHfq-E5a7xDgXOzQbUxVjiB-t-Ot2L5kOg1VZPEDZ7xh2WSnqTlzojuHpJecoiimQ-4Wu9GAM0SEWaedUypbVsWNAaDLaeNA4j9IpGcl2L5Q1EI4qA3hPpi21KRdQnv3chnAb5M9uLBwZoXfDaOTD_SqrE846LR0GOFsV_mSwHEa9Nb6aP2y_DXetyyL2i3a7OXFF-IP-35zOIorWlswnomCwnbn2YlJYTi6SvDtxwvgC3AtdzO3SFHndRT71DrRapLV0tZT0GOF9PkbsTh_E1ooqCLMXt4z4dgVKcjk4prKQ2aaeoY5qeXMEzJmzE5x8YUm30DMjdlUJFJahAQ","e":"AQAB"}]}'
                      rules:
                        - match: { prefix: "/" }
                          requires: { provider_name: "provider1" }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
