node: { id: envoy-rust-phase-18-fixture-0026, cluster: envoy-rust-phase-18 }
admin: { address: { socket_address: { address: 0.0.0.0, port_value: {{ADMIN_PORT}} } } }
dynamic_resources:
  cds_config:
    resource_api_version: V3
    path_config_source:
      path: {{CDS_PATH}}
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http1
                codec_type: HTTP1
                # Envoy injects a UUID `x-request-id` per request unless this is
                # disabled. Suppressing it keeps the helper's deterministic-echo
                # body byte-equal across both proxies (envoy-rust does not inject
                # `x-request-id` in 04.3).
                generate_request_id: false
                route_config:
                  name: local_route
                  # `validate_clusters: false` (L12b / ADR-0049): with CDS
                  # configured the route's `dynamic_backend` cluster is not yet
                  # present at config-load time; Envoy's default route-config
                  # validation would reject the bootstrap with "route: unknown
                  # cluster". Disabling it lets the route reference a
                  # CDS-supplied cluster.
                  validate_clusters: false
                  # `request_headers_to_remove` at the route_config level applies
                  # to every route; strips the headers Envoy v1.33 injects by
                  # default on the upstream-bound request. envoy-rust does not
                  # inject these in 04.3 (per SPEC §4 non-goal); stripping on the
                  # Envoy side is what makes the helper's deterministic echo body
                  # byte-equal across proxies. envoy-rust.yaml omits this field
                  # because envoy-rust's parser does not recognize it (field-set
                  # divergence is intentional, mirrors fixture 0005's `admin:` /
                  # bind divergences).
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: backend_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: dynamic_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
