node: { id: envoy-rust-phase-27-fixture-0035, cluster: envoy-rust-phase-27 }
# Kernel-ephemeral admin (port 0): the Http1EdsReload driver probes ONLY the
# data listener (/probe) and never scrapes admin (mirrors the RDS-hot-reload
# sibling 0034). The harness `needs_admin_port` gate does not reserve/substitute
# {{ADMIN_PORT}} for this driver, so a literal {{ADMIN_PORT}} would crash Envoy
# with a yaml-cpp "bad conversion" at boot.
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 0 } } }
# NO `dynamic_resources`: the `eds_backend` cluster is STATIC-but-EDS — its
# `load_assignment` (endpoint) arrives from the SHARED eds.yaml at boot via
# `eds_cluster_config.eds_config.path_config_source.path`, and is hot-reloaded
# from eds-reload.yaml at runtime (the file is atomic-renamed in-container).
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                # INLINE route_config: the route table is static. `/probe` routes
                # to the EDS-supplied cluster `eds_backend`.
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/probe" }
                          route: { cluster: eds_backend }
                # === Envoy-only byte-exact-body stripping knobs (fixture
                # 0029 per-side main-config precedent) ===
                #   - generate_request_id: false  -> suppresses `x-request-id`.
                #   - the header_mutation filter (below) -> decode-side removal
                #     of the `x-forwarded-for`/`x-forwarded-proto` the HCM adds.
                #   - the router's `suppress_envoy_headers: true` -> suppresses
                #     the router-injected `x-envoy-*` request headers. envoy-rust
                #     emits these natively, so `envoy-rust.yaml` omits ALL of
                #     these knobs (intentional per-side field-set divergence).
                #     Both sides forward an identical request to the echo helper,
                #     so the byte-exact `backend: backend_N` discriminator body
                #     holds bilaterally.
                generate_request_id: false
                http_filters:
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-forwarded-for
                          - remove: x-forwarded-proto
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
  clusters:
    # The `eds_backend` cluster: STATIC cluster declaration with `type: EDS`.
    # NO inline `load_assignment` — the endpoint arrives from the SHARED
    # eds.yaml at boot via `eds_cluster_config.eds_config.path_config_source`,
    # then is hot-reloaded from eds-reload.yaml. NO health_checks / NO
    # outlier_detection (the plain EDS cluster shape).
    - name: eds_backend
      type: EDS
      lb_policy: ROUND_ROBIN
      eds_cluster_config:
        eds_config:
          resource_api_version: V3
          path_config_source:
            path: {{EDS_PATH}}
