# Phase-31 differential acceptance fixture: drive 5 sequential HTTP/1.1 requests
# through an HCM whose http_filters chain is
#   [envoy.filters.http.cdn_loop, envoy.filters.http.router]
# proxying the single prefix "/" route to a real http1-echo-server upstream
# cluster (the 0013-header-mutation / 0032-csrf pattern — the cdn_loop filter
# mutates the forwarded CDN-Loop request header, observed via the echo body, and
# rejects loop/malformed requests with a synthesized local reply).
#
# CdnLoopConfig (RFC 8586 loop detection, ADR-0077 §6.2-LOCKED):
#   cdn_id: "mycdn.example"
#   max_allowed_occurrences: 0
#
# Decode-side behaviour:
#   - no CDN-Loop header           → append bare `mycdn.example`, forward → 200
#   - CDN-Loop: mycdn.example      → count(mycdn.example)=1 > 0 → 502
#                                    "The server has detected a loop between CDNs."
#   - CDN-Loop: othercdn.example   → count=0, append COMMA-ONLY → forward
#                                    `othercdn.example,mycdn.example` → 200
#   - CDN-Loop: "abc  (malformed)  → 400 "Invalid CDN-Loop header in request."
#   - CDN-Loop: othercdn.example,  → empty trailing entry PRESERVED on append →
#                                    `othercdn.example,,mycdn.example` → 200
#
# The append probes (P1/P3/P5) observe the forwarded `cdn-loop` request header
# via the http1-echo-server echo body (which reflects received request headers
# as alphabetically-SORTED, lowercase `  name: value` lines — so the forwarded
# CDN-Loop header surfaces as `  cdn-loop: <value>` regardless of wire casing).
# Both proxies forward an identical upstream request (upstream Envoy strips its
# auto-injected headers via request_headers_to_remove; envoy-rust injects none)
# → byte-identical echo body → equivalence.response_body byte_exact holds.
#
# The reject probes (P2 502 / P4 400) carry a byte-exact local-reply body, a
# pure function of the filter (not the request) → byte-identical cross-proxy.
# NOTE: every probe driver sends `Connection: close`; the shared filter-synth
# decorator keys the reply `connection` header off the close flag (NOT status),
# so both the 502 and 400 carry `connection: close` on BOTH proxies — value
# compared and clean (the 0032 csrf-403 precedent). Do NOT suppress it.
#
# Per-side YAML asymmetry (0013/0032/0008 precedent):
#   - upstream side: admin block (port 0; kernel-ephemeral); bind
#     0.0.0.0:{{PORT}} (Docker public bind); generate_request_id: false;
#     request_headers_to_remove stripping Envoy's auto-injected upstream headers
#     so the echo body is byte-equal across both proxies; cluster
#     dns_lookup_family: V4_ONLY; {{BACKEND_HOST}} = host.docker.internal.
#   - envoy-rust side: no admin block; bind 127.0.0.1:{{PORT}}; neither
#     generate_request_id nor request_headers_to_remove (no-op divergence —
#     envoy-rust injects none of those headers); {{BACKEND_HOST}} = 127.0.0.1.
# References: ADR-0076 (phase-31 SPEC), ADR-0077 (phase-31 PLAN-write §6.2-LOCKED).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-31-cluster
  id: phase-31-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                http_filters:
                  - name: envoy.filters.http.cdn_loop
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cdn_loop.v3.CdnLoopConfig
                      cdn_id: "mycdn.example"
                      max_allowed_occurrences: 0
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} } }
