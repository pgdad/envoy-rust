# Phase-31: 5-probe sequential burst against the HCM filter chain
#   [envoy.filters.http.cdn_loop, envoy.filters.http.router]
# with CdnLoopConfig { cdn_id: "mycdn.example", max_allowed_occurrences: 0 } on a
# prefix "/" route that proxies to a real http1-echo-server cluster.
#
# RFC 8586 loop detection (ADR-0077 §6.2-LOCKED against envoyproxy/envoy:v1.33.0):
# the cdn_loop decode side coalesces all CDN-Loop request-header values, parses
# them (RFC 7230 list/token/parameter grammar), then:
#   - malformed → 400 byte-exact "Invalid CDN-Loop header in request." (35B)
#   - count(cdn_id) > max_allowed_occurrences → 502 byte-exact
#     "The server has detected a loop between CDNs." (44B)
#   - else append this proxy's cdn_id COMMA-ONLY to the RAW coalesced bytes
#     (empty entries preserved) and forward ONE coalesced header → 200.
#
# Probe sequence (all HOST: cdn.test) → status [200, 502, 200, 400, 200]:
#   P1 no-header        — no CDN-Loop → append bare → forward `cdn-loop: mycdn.example` → 200, echo
#   P2 self-loop        — CDN-Loop: mycdn.example → count=1 > 0 → 502, byte-exact loop body
#   P3 foreign-append   — CDN-Loop: othercdn.example → append comma-only →
#                         forward `cdn-loop: othercdn.example,mycdn.example` → 200, echo
#   P4 malformed        — CDN-Loop: "abc (unterminated quoted-string id) → 400, byte-exact malformed body
#   P5 trailing-comma   — CDN-Loop: othercdn.example, → empty entry preserved →
#                         forward `cdn-loop: othercdn.example,,mycdn.example` → 200, echo
#
# The append probes (P1/P3/P5) observe the FORWARDED cdn-loop header via the
# http1-echo-server echo body. The echo server reflects request headers as
# alphabetically-sorted, lowercase `  name: value` lines, so the forwarded
# CDN-Loop surfaces as a `  cdn-loop: <value>` line regardless of the wire
# casing either proxy emits. Both proxies forward an identical upstream request
# (upstream Envoy strips its auto-injected headers; envoy-rust injects none) →
# byte-identical echo body, confirmed cross-proxy via equivalence.response_body
# (byte_exact). This is the STRONG cross-proxy byte-exact proof of the append
# byte-shape (comma-only join; empty entries preserved).
#
# The reject probes (P2 502 / P4 400) pin the local-reply body byte-exact (a
# pure function of the filter, not the request → identical cross-proxy).
#
# connection header: every probe driver sends `Connection: close`; the shared
# decorate_filter_synth_response keys the reply `connection` header off the
# per-request close flag (NOT the status). So BOTH the 502 and 400 carry
# `connection: close` on BOTH proxies — value-compared (connection is NOT on the
# allow-list) and resolves clean both sides (the 0032 csrf-403 precedent).
#
# expected_headers: set_equal_modulo_allow_list compares the response header sets
# value-exact modulo the server/date/x-envoy-upstream-service-time allow-list.
driver:
  kind: http1_probe_list
  probes:
    - name: probe-1-no-header-200
      method: get
      path: "/"
      host: "cdn.test"
      extra_headers: []
      expected_status: 200
      expected_headers: set_equal_modulo_allow_list
    - name: probe-2-self-loop-502
      method: get
      path: "/"
      host: "cdn.test"
      extra_headers:
        - ["cdn-loop", "mycdn.example"]
      expected_status: 502
      expected_body: { kind: byte_exact, body: "The server has detected a loop between CDNs." }
      expected_headers: set_equal_modulo_allow_list
    - name: probe-3-foreign-append-200
      method: get
      path: "/"
      host: "cdn.test"
      extra_headers:
        - ["cdn-loop", "othercdn.example"]
      expected_status: 200
      expected_headers: set_equal_modulo_allow_list
    - name: probe-4-malformed-400
      method: get
      path: "/"
      host: "cdn.test"
      extra_headers:
        - ["cdn-loop", "\"abc"]
      expected_status: 400
      expected_body: { kind: byte_exact, body: "Invalid CDN-Loop header in request." }
      expected_headers: set_equal_modulo_allow_list
    - name: probe-5-trailing-comma-200
      method: get
      path: "/"
      host: "cdn.test"
      extra_headers:
        - ["cdn-loop", "othercdn.example,"]
      expected_status: 200
      expected_headers: set_equal_modulo_allow_list
equivalence:
  response_status: exact
  response_body: { kind: byte_exact }
