node: { id: envoy-rust-phase-20-fixture-0028, cluster: envoy-rust-phase-20 }
admin: { address: { socket_address: { address: 0.0.0.0, port_value: {{ADMIN_PORT}} } } }
dynamic_resources:
  cds_config:
    resource_api_version: V3
    path_config_source:
      path: {{CDS_PATH}}
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 127.0.0.1, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http1
                codec_type: HTTP1
                # The HCM is RDS-configured: NO inline `route_config`. The route
                # table arrives entirely from the RDS file (the SHARED rds.yaml,
                # rendered per-side). `route_config_name` must match the
                # RouteConfiguration name in rds.yaml (`local_route`).
                rds:
                  route_config_name: local_route
                  config_source:
                    resource_api_version: V3
                    path_config_source:
                      path: {{RDS_PATH}}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # The STATIC `static_backend` cluster (probe 1's target — keeps it orthogonal
    # to CDS). The CDS file supplies the second cluster, `dynamic_backend`.
    - name: static_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: static_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} }
