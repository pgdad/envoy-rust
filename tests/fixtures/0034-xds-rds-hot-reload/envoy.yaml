node: { id: envoy-rust-phase-26-fixture-0034, cluster: envoy-rust-phase-26 }
# Kernel-ephemeral admin (port 0): the Http1RdsReload driver probes ONLY the
# data listener (/probe) and never scrapes admin — so this reference side
# follows the non-admin-scraping convention (fixtures 0007/0031/0033), NOT the
# {{ADMIN_PORT}} convention of the admin-scraping RDS sibling 0028. (The harness
# `needs_admin_port` gate does not reserve/substitute {{ADMIN_PORT}} for this
# driver, so a literal {{ADMIN_PORT}} here would crash Envoy with a yaml-cpp
# "bad conversion" at boot.)
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 0 } } }
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http1
                codec_type: HTTP1
                # The HCM is RDS-configured: NO inline `route_config`. The route
                # table arrives entirely from the watched RDS file (the SHARED
                # rds.yaml, rendered per-side). `route_config_name` must match the
                # RouteConfiguration name in rds.yaml (`local_route`). The
                # `path_config_source.path` is the file the harness atomic-renames
                # over at reload time (rds.yaml -> rds-reload.yaml); Envoy v1.33's
                # default file-watch re-reads it and hot-swaps the route table.
                #
                # NO header-stripping knobs (unlike fixture 0028): the responses
                # are pure `direct_response` bodies — there is NO upstream and NO
                # proxy-injected upstream-header noise, so the bodies are
                # byte-identical on both sides natively.
                rds:
                  route_config_name: local_route
                  config_source:
                    resource_api_version: V3
                    path_config_source:
                      path: {{RDS_PATH}}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  # NO clusters: the observable is a `direct_response` route (status/body),
  # so no upstream backend is needed.
  clusters: []
