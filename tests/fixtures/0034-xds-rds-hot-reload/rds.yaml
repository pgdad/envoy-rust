# The INITIAL shared RDS file (L1 / ADR-0051): a bare `resources:` envelope with
# one `@type`-tagged RouteConfiguration payload named `local_route`. As in
# fixture 0028, the RDS file is a SINGLE SHARED template rendered per-side
# through each side's kv map, so it carries NO Envoy-only fields: envoy-rust's
# RouteConfiguration / VirtualHost use `deny_unknown_fields`.
#
# The single observable is a `direct_response` body (`rds-v1\n`), NOT a cluster:
# the Http1RdsReload discriminator converges on status/body and the harness
# spawns no backend for this fixture. The body change `rds-v1` -> `rds-v2`
# (rds-reload.yaml) is the bilateral hot-reload proof — a genuine route-table
# swap, byte-exact and identical on both sides with zero upstream-header noise.
resources:
  - "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: local_route
    virtual_hosts:
      - name: local_vh
        domains: ["*"]
        routes:
          - match: { prefix: "/probe" }
            direct_response:
              status: 200
              body: { inline_string: "rds-v1\n" }
