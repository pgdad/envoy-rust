node: { id: envoy-rust-phase-26-fixture-0034, cluster: envoy-rust-phase-26 }
admin: { address: { socket_address: { address: 0.0.0.0, port_value: {{ADMIN_PORT}} } } }
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 127.0.0.1, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http1
                codec_type: HTTP1
                # The HCM is RDS-configured: NO inline `route_config`. The route
                # table arrives entirely from the watched RDS file (the SHARED
                # rds.yaml, rendered per-side). `route_config_name` must match the
                # RouteConfiguration name in rds.yaml (`local_route`). The
                # `path_config_source.path` is the file the harness atomic-renames
                # over at reload time (rds.yaml -> rds-reload.yaml).
                rds:
                  route_config_name: local_route
                  config_source:
                    resource_api_version: V3
                    path_config_source:
                      path: {{RDS_PATH}}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  # NO clusters: the observable is a `direct_response` route (status/body),
  # so no upstream backend is needed.
  clusters: []
