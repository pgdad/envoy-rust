node: { id: envoy-rust-phase-21-fixture-0029, cluster: envoy-rust-phase-21 }
admin: { address: { socket_address: { address: 0.0.0.0, port_value: {{ADMIN_PORT}} } } }
# NO `dynamic_resources`: the `eds_backend` cluster is STATIC-but-EDS — its
# `load_assignment` (endpoints) arrives from the SHARED eds.yaml at boot via
# `eds_cluster_config.eds_config.path_config_source.path`, NOT from CDS.
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 127.0.0.1, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                # INLINE route_config: the route table is static. `/` routes to
                # the EDS-supplied cluster `eds_backend`. envoy-rust emits the
                # proxy-injected-header stripping natively, so this side carries
                # NONE of the Envoy-only main-config knobs (the per-side
                # field-set divergence — see envoy.yaml / README).
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: eds_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # The `eds_backend` cluster: STATIC cluster declaration with `type: EDS`.
    # NO inline `load_assignment` — the endpoints arrive from the SHARED
    # eds.yaml at boot via `eds_cluster_config.eds_config.path_config_source`.
    - name: eds_backend
      type: EDS
      lb_policy: ROUND_ROBIN
      eds_cluster_config:
        eds_config:
          resource_api_version: V3
          path_config_source:
            path: {{EDS_PATH}}
