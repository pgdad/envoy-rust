node: { id: envoy-rust-phase-21-fixture-0029, cluster: envoy-rust-phase-21 }
admin: { address: { socket_address: { address: 0.0.0.0, port_value: {{ADMIN_PORT}} } } }
# NO `dynamic_resources`: the `eds_backend` cluster is STATIC-but-EDS — its
# `load_assignment` (endpoints) arrives from the SHARED eds.yaml at boot via
# `eds_cluster_config.eds_config.path_config_source.path`, NOT from CDS.
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                # INLINE route_config (unlike fixture 0028's RDS): the route table
                # is static. `/` routes to the EDS-supplied cluster `eds_backend`.
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: eds_backend }
                # === Envoy-only byte-exact-body stripping knobs (fixture
                # 0008/0026/0027/0028 per-side main-config precedent) ===
                #   - generate_request_id: false  -> suppresses `x-request-id`.
                #   - the header_mutation filter (below) -> decode-side removal
                #     of the `x-forwarded-for`/`x-forwarded-proto` the HCM adds.
                #   - the router's `suppress_envoy_headers: true` -> suppresses
                #     the router-injected `x-envoy-*` request headers (notably
                #     `x-envoy-expected-rq-timeout-ms`). It ALSO drops the
                #     RESPONSE header `x-envoy-upstream-service-time`, so the
                #     header_mutation `response_mutations` re-adds it (presence
                #     only; value differs per side). envoy-rust emits these
                #     natively, so `envoy-rust.yaml` omits ALL of these knobs
                #     (intentional per-side field-set divergence). Both sides
                #     forward an identical request to the echo helper, so the
                #     byte-exact body holds.
                generate_request_id: false
                http_filters:
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-forwarded-for
                          - remove: x-forwarded-proto
                        response_mutations:
                          - append:
                              header:
                                key: x-envoy-upstream-service-time
                                value: "0"
                              append_action: APPEND_IF_EXISTS_OR_ADD
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
  clusters:
    # The `eds_backend` cluster: STATIC cluster declaration with `type: EDS`.
    # NO inline `load_assignment` — the endpoints arrive from the SHARED
    # eds.yaml at boot via `eds_cluster_config.eds_config.path_config_source`.
    - name: eds_backend
      type: EDS
      lb_policy: ROUND_ROBIN
      eds_cluster_config:
        eds_config:
          resource_api_version: V3
          path_config_source:
            path: {{EDS_PATH}}
