# Phase 13.2 D9.1-H2 differential fixture (envoy-rust side; per ADR-0039
# topology pivot). Binds 127.0.0.1 (not 0.0.0.0) per the host-subprocess
# shape — admin block included for the post-settle bilateral stat
# scrape on {{ADMIN_PORT}}. `generate_request_id` is omitted (envoy-rust's
# HCM config does not model it — see fixture 0019/0020 envoy-rust.yaml
# precedent).
#
# Downstream codec is HTTP2 (the ADR-0039 pivot; the PLAN's HTTP1
# downstream + H2 upstream cluster topology is rejected at parse time
# by the 06.3 D14.3 gate per ADR-0028).
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-13-cluster
  id: phase-13-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP2
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{HTTP2_BACKEND_PORT}}
