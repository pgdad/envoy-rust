# Phase 13.2 D9.1-H2 differential fixture (per ADR-0039 topology pivot):
# assert H2 connection-pool reuse + the
# `cluster.<name>.upstream_cx_http2_total` new counter. Combined with
# the 13.2 D7.1 BEHAVIOR_CONTRACT row tightening (`upstream_cx_total`
# value-exact), this fixture closes 06.3 REVIEW I2 (b) — the second
# half of the H2 pool integration.
#
# Topology (ADR-0039 pivot — the original PLAN's H1-downstream + H2-upstream
# topology was rejected at parse time by the 06.3 D14.3 gate per ADR-0028's
# H1-listener × H2-cluster deferral):
#   - downstream: HTTP/2 (H2C prior-knowledge) listener on {{PORT}};
#                 admin on {{ADMIN_PORT}}.
#   - upstream  : http2-echo-server (H2C) at {{BACKEND_HOST}}:{{HTTP2_BACKEND_PORT}}.
#                 200 default for all paths (the helper echoes the request).
#   - cluster   : backend_cluster, STRICT_DNS, H2 upstream via
#                 typed_extension_protocol_options + circuit_breakers
#                 (max_connections: 4 — enough headroom for the single H2
#                 pool conn the discriminator asserts).
#
# Driver: `http2_keep_alive` (ADR-0039 new driver variant; mirrors 13.1
# D10's `http1_keep_alive` shape verbatim modulo codec). ONE downstream
# H2 connection, 5 sequential single-stream GETs to /, then a 500ms
# settle + bilateral admin stat scrape on the H2-pool-reuse counters.
#
# Per parent-13 SPEC §6.2 item-iv + lock-in #4 (preserved under the
# ADR-0039 pivot): upstream_cx_total: 1 because the H2 pool (Task 2)
# reuses the single upstream H2 conn across all 5 downstream → upstream
# stream dispatches. With the per-call `Client::connect` regression this
# counter would be 5 and the fixture would fail RED.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-13-cluster
  id: phase-13-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP2
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{HTTP2_BACKEND_PORT}}
