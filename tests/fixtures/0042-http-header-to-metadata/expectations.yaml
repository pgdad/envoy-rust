driver:
  kind: http1_access_log_byte_exact
  expected_access_log_paths:
    envoy: /tmp/0042-envoy-mount/access.log
    envoy_rust: /tmp/0042-envoy-rust-mount/access.log
  probes:
    # Probe 1: GET /a with x-tier: prod header present.
    # The header_to_metadata filter matches x-tier → on_header_present →
    # writes envoy.lb→{tier: prod} into the per-request dynamic-metadata
    # store. %DYNAMIC_METADATA(envoy.lb:tier)% resolves the RAW, UNQUOTED
    # scalar `prod` (§A3). The absent namespace (envoy.absent:k) renders
    # the canonical absent sentinel `-` (§A4) on BOTH proxies.
    # Expected line (byte-identical on both sides):
    #   m=GET tier=prod missns=-
    - method: get
      path: /a
      host: envoy-rust.test
      extra_headers:
        - ["x-tier", "prod"]
    # Probe 2: GET /b with NO x-tier header (on_header_missing fires).
    # The header_to_metadata filter invokes on_header_missing → writes
    # envoy.lb→{tier: missing} (the quoted value "missing" from config).
    # %DYNAMIC_METADATA(envoy.lb:tier)% resolves `missing`.
    # Expected line (byte-identical on both sides):
    #   m=GET tier=missing missns=-
    - method: get
      path: /b
      host: envoy-rust.test
