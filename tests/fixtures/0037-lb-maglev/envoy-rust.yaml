node: { id: envoy-rust-phase-29-fixture-0037, cluster: envoy-rust-phase-29 }
# Kernel-ephemeral admin (port 0): the Http1HashSweep driver probes ONLY the
# data listener (GET / with an x-hash-key header) and never scrapes admin.
admin: { address: { socket_address: { address: 127.0.0.1, port_value: 0 } } }
# 29 fixture-0037 (ADR-0072): MAGLEV consistent-hashing LB cross-proxy
# differential. ONE STATIC H1 HCM listener routes `/` to a STATIC cluster
# `maglev_cluster` (`lb_policy: MAGLEV`) with TWO distinguishable echo
# backends. The route action carries a `hash_policy` keyed on the `x-hash-key`
# request header, so the per-request hash = xxh64(header value) selects a table
# entry. IDENTICAL config to envoy.yaml except the listener bind address
# (127.0.0.1 here vs 0.0.0.0 upstream) — the standard harness per-side
# convention. The STATIC endpoint address is the `{{BACKEND_IP}}` marker,
# rendered to the SAME shared host LAN IPv4 as envoy.yaml (NOT loopback) so both
# proxies build the SAME MAGLEV table. No behavioral divergence.
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 127.0.0.1, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: maglev_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: maglev_cluster
                            # ADR-0072: per-request hash = xxh64(x-hash-key
                            # header value); table[hash % table_size] selects
                            # the backend.
                            hash_policy:
                              - header:
                                  header_name: "x-hash-key"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # `maglev_cluster`: a PLAIN STATIC MAGLEV cluster (the MVP) — NO health
    # check, NO outlier detection. Two distinguishable echo backends
    # (`--body-marker backend_1`/`backend_2`); each response body's leading
    # `backend: <marker>\n` line names which backend the table selected.
    - name: maglev_cluster
      type: STATIC
      lb_policy: MAGLEV
      # ADR-0072: table_size M (prime). 65537 is the Envoy proto default; set
      # explicitly for clarity.
      maglev_lb_config:
        table_size: 65537
      load_assignment:
        cluster_name: maglev_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{BACKEND_IP}}, port_value: {{HTTP1_BACKEND_1_PORT}} }
              - endpoint:
                  address:
                    socket_address: { address: {{BACKEND_IP}}, port_value: {{HTTP1_BACKEND_2_PORT}} }
