# envoy-rust per-side divergences from envoy.yaml:
#   - bind 127.0.0.1 instead of 0.0.0.0 (no Docker indirection).
#   - request_headers_to_remove omitted (envoy-rust does not inject these).
#   - generate_request_id omitted (envoy-rust does not inject x-request-id).
# Admin listener IS retained — fixture 0014's whole purpose is differential
# scrape of /config_dump + /server_info + /clusters + /listeners via
# Driver::AdminScrape; admin_host_port plugs into {{ADMIN_PORT}} on the
# subject side just as it plugs into the upstream side.

node:
  id: envoy-rust-phase-08.1-fixture-0014
  cluster: envoy-rust-phase-08.1
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ADMIN_PORT}}
static_resources:
  listeners:
    - name: ingress_http
      address: { socket_address: { address: 127.0.0.1, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} } }
