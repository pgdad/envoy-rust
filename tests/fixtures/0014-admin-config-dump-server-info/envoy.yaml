# Phase 08.1 fixture 0014 — admin /config_dump + /server_info + /clusters +
# /listeners scrape (D17.1). Mirrors fixture 0008's HCM + STRICT_DNS-cluster
# bootstrap shape so the admin endpoints have non-trivial content to render,
# but no data-plane traffic is driven against the HCM listener — fixture
# 0014's Driver::AdminScrape carries no pre_requests.
#
# request_headers_to_remove + generate_request_id: false suppress upstream-
# Envoy injections that envoy-rust does not emit (mirroring fixture 0008 +
# 0011's pattern). Harmless here — the listener is never exercised — but kept
# for cross-fixture consistency so the `/config_dump` bootstrap projection
# matches across fixture families.

node:
  id: envoy-rust-phase-08.1-fixture-0014
  cluster: envoy-rust-phase-08.1
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
static_resources:
  listeners:
    - name: ingress_http
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: local_route
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: backend_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} } }
