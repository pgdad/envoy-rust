# Phase 09 differential acceptance fixture: drive 5 sequential GET / requests
# through an HCM whose http_filters chain is
#   [envoy.filters.http.local_ratelimit, envoy.filters.http.router]
# with token_bucket { max_tokens: 3, tokens_per_fill: 3, fill_interval: 60s }
# (no refill within the 5-probe burst window since the burst completes in
# well under 60s). First 3 succeed (200); requests 4 + 5 are rate-limited
# (429 + body "local_rate_limited" per ADR-0033). tokens_per_fill is 3 (not 0) because
# upstream Envoy v1.33's TokenBucketValidator constrains tokens_per_fill > 0;
# envoy-rust's validator accepts 0 (lock-in #4) but to keep both proxies
# bilaterally green we pick the stricter intersection.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-09-cluster
  id: phase-09-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          # {{PORT}} is harness-substituted to a per-fixture-run port (the
          # testcontainers container's CONTAINER_PORT is 10000 — the same
          # template emits the static value 10000 on the upstream side).
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: phase_09
                      token_bucket:
                        max_tokens: 3
                        tokens_per_fill: 3
                        fill_interval: 60s
                      status: { code: 429 }
                      # Upstream Envoy v1.33's filter_enabled / filter_enforced
                      # default to 0% (off). envoy-rust defaults to always-on
                      # per phase-09 lock-in (these fields are not yet modeled
                      # in envoy-rust's LocalRateLimitConfig; deny_unknown_fields
                      # rejects them on the envoy-rust side). Set both to 100%
                      # here to match envoy-rust's always-on behaviour for the
                      # bilateral differential. Per-side YAML asymmetry follows
                      # the fixture-0013 precedent.
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
