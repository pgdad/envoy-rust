# Phase 09 envoy-rust counterpart. Identical shape modulo bind address
# (127.0.0.1 for envoy-rust per fixture-0013 precedent) and the absent
# admin block (envoy-rust harness does not probe admin for direct_response
# fixtures). The {{PORT}} token is substituted by the harness to a
# per-fixture-run kernel-ephemeral port.
node:
  cluster: phase-09-cluster
  id: phase-09-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: phase_09
                      token_bucket:
                        max_tokens: 3
                        tokens_per_fill: 3
                        fill_interval: 60s
                      status: { code: 429 }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
