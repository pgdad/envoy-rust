# Phase 13.1 D9.1 differential fixture: assert H1 connection-pool reuse +
# per-class downstream + upstream counter bilateral coverage. Closes
# 06.3 REVIEW I2 (a) — the wire-level per-class counter property.
#
# Topology:
#   - downstream: HTTP/1.1 listener on {{PORT}}; admin on {{ADMIN_PORT}}.
#   - upstream  : configurable-status backend at {{BACKEND_HOST}}:{{BACKEND_PORT}}.
#                 200 default; /301->301, /404->404, /500->500 via --per-path flag.
#   - cluster   : backend_cluster, STRICT_DNS, default circuit_breakers
#                 (max_connections: 4 — enough headroom for the single H1
#                 pool conn the discriminator asserts).
#
# Driver: `http1_keep_alive` (13.1 D10) — ONE downstream keep-alive conn,
# 10 sequential GETs spanning 2xx/3xx/4xx/5xx classes, then a 500ms settle
# + bilateral admin stat scrape asserting the 12 per-class + pool-reuse
# counters byte-equal.
#
# Per parent-13 SPEC §6.2 item-iv: upstream_cx_total: 1 because the H1
# pool reuses the single upstream conn across all 10 requests. With the
# per-call-`Client::connect` regression this counter would be 10 (one
# new conn per request) and the fixture would fail RED.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: {{ADMIN_PORT}}
node:
  cluster: phase-13-cluster
  id: phase-13-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{BACKEND_PORT}}
