# envoy-rust side. Active gRPC health check (`grpc_health_check`) against a
# REFUSED port ({{DEAD_BACKEND_PORT}} has no listener) → after settle the
# sole endpoint is Unhealthy → pick() None → synth-503. Mirrors fixture
# 0074's envoy-rust.yaml topology (ADR-0137 PV-2 shape) with an H2
# listener + H2-upstream cluster and `grpc_health_check` swapped in
# (ADR-0138/ADR-0139).
# No admin block; bind 127.0.0.1; no generate_request_id (envoy-rust's HCM
# config does not model it).
node:
  cluster: phase-69-cluster
  id: phase-69-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP2
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: grpc_hc_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: grpc_hc_backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 1s
          healthy_threshold: 1
          unhealthy_threshold: 2
          grpc_health_check: {}
      load_assignment:
        cluster_name: grpc_hc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{DEAD_BACKEND_PORT}}
