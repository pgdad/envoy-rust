# Phase 69 differential acceptance fixture: assert post-convergence active
# gRPC-HC steady state on an H2 listener (ADR-0138/ADR-0139).
#
# Topology:
#   - downstream: HTTP/2 (h2c prior-knowledge) listener on {{PORT}} -> HCM ->
#                 router -> cluster `grpc_hc_backend`
#   - upstream  : NO backend — {{DEAD_BACKEND_PORT}} is a reserved-but-unbound
#                 port, so the gRPC HC probe gets ECONNREFUSED every tick
#   - cluster   : H2-upstream (`typed_extension_protocol_options` ->
#                 `explicit_http_config.http2_protocol_options: {}`, required
#                 by ADR-0139 — `grpc_health_check` is fatal-at-load on a
#                 non-H2 cluster), active gRPC HC every 1s,
#                 `unhealthy_threshold: 2`, panic disabled
#                 (`healthy_panic_threshold: { value: 0 }`)
#
# After ~3.5 s + margin both proxies converge: the sole endpoint is ejected
# (connect refused -> failure -> Unhealthy after 2 consecutive) -> `pick() ->
# None` -> synth-503 with body `no healthy upstream` (19 bytes, ADR-0037).
# Driver: `Driver::Http2AfterSettle` (settle 3500 ms, then GET /).
#
# Same downstream observable as fixture 0074 (the TCP-HC ejection) except the
# listener/cluster are H2 (grpc_health_check requires an H2 upstream) and the
# checker is `grpc_health_check` (a unary gRPC Health/Check call) rather than
# a connection-only `tcp_health_check` (ADR-0138/ADR-0139).
#
# ADR-0028 is deliberately NOT lifted here: this fixture uses an H2
# LISTENER (not an H1 listener over an H2 cluster) because the H2-upstream
# cluster required by `grpc_health_check` forbids an H1 listener at parse
# time (06.3 D14.3 gate) — see fixture 0021/0010 precedent for the same
# H2-listener-because-H2-cluster shape.
#
# Integer-second durations per §6.2 item-6.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-69-cluster
  id: phase-69-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP2
                stat_prefix: ingress_http
                generate_request_id: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: grpc_hc_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: grpc_hc_backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 1s
          healthy_threshold: 1
          unhealthy_threshold: 2
          grpc_health_check: {}
      load_assignment:
        cluster_name: grpc_hc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{BACKEND_HOST}}
                      port_value: {{DEAD_BACKEND_PORT}}
