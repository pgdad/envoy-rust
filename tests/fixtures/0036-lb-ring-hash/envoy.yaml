node: { id: envoy-rust-phase-28-fixture-0036, cluster: envoy-rust-phase-28 }
# Kernel-ephemeral admin (port 0): the Http1HashSweep driver probes ONLY the
# data listener (GET / with an x-hash-key header) and never scrapes admin, so
# this fixture follows the non-admin-scraping convention (the harness
# `needs_admin_port` gate does not reserve/substitute {{ADMIN_PORT}} for this
# driver, so a literal {{ADMIN_PORT}} would crash Envoy at boot with a yaml-cpp
# "bad conversion").
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 0 } } }
# 28 fixture-0036 (ADR-0070): RING_HASH consistent-hashing LB cross-proxy
# differential. ONE STATIC H1 HCM listener routes `/` to a STATIC cluster
# `ring_cluster` (`lb_policy: RING_HASH`) with TWO distinguishable echo
# backends. The route action carries a `hash_policy` keyed on the `x-hash-key`
# request header, so the per-request hash = xxh64(header value) selects a ring
# entry. The Http1HashSweep driver sweeps a list of header values against BOTH
# proxies and asserts cross-proxy identical backend selection per key (STRONG),
# full-sweep spread (both backends hit), and same-key stability.
#
# envoy.yaml and envoy-rust.yaml are IDENTICAL config except the listener bind
# address (0.0.0.0 here vs 127.0.0.1 on the subject) — the standard harness
# per-side convention. The STATIC endpoint address is the `{{BACKEND_IP}}`
# marker — the harness renders it to ONE SHARED numeric IP (the host's LAN
# IPv4), IDENTICAL on BOTH sides, so both proxies build their RING_HASH ring
# from the SAME `ip:port` keys (the cross-proxy STRONG-selection precondition).
# A STATIC cluster rejects hostnames, hence a numeric IP. No behavioral
# divergence (see README).
static_resources:
  listeners:
    - name: http1_listener
      address: { socket_address: { address: 0.0.0.0, port_value: {{PORT}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ring_vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: ring_cluster
                            # ADR-0070: per-request hash = xxh64(x-hash-key
                            # header value); first-entry->= ring lookup with
                            # wrap selects the backend.
                            hash_policy:
                              - header:
                                  header_name: "x-hash-key"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # `ring_cluster`: a PLAIN STATIC RING_HASH cluster (the MVP) — NO health
    # check, NO outlier detection. Two distinguishable echo backends
    # (`--body-marker backend_1`/`backend_2`); each response body's leading
    # `backend: <marker>\n` line names which backend the ring selected.
    - name: ring_cluster
      type: STATIC
      lb_policy: RING_HASH
      # ADR-0070: replicas per host = minimum_ring_size / num_hosts. Default is
      # 1024; set explicitly for clarity (1024 / 2 hosts = 512 replicas/host).
      ring_hash_lb_config:
        minimum_ring_size: 1024
      load_assignment:
        cluster_name: ring_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{BACKEND_IP}}, port_value: {{HTTP1_BACKEND_1_PORT}} }
              - endpoint:
                  address:
                    socket_address: { address: {{BACKEND_IP}}, port_value: {{HTTP1_BACKEND_2_PORT}} }
