# Phase 36: 4-probe sequential burst proving the RBAC matcher-VALUE enrichment
# verdict is byte-identical cross-proxy. Probes a/b exercise F2 (metadata
# safe_regex match/miss); probes c/d exercise F1 (present_match present/absent).
# The two policies are OR'd; each probe's headers select which policy (if any)
# fires. 403 body is "RBAC: access denied" (19 bytes, NO trailing newline,
# ADR-0034). Reuses the fixture-0017/0043 http1_probe_list driver + extra_headers.
driver:
  kind: http1_probe_list
  probes:
    - name: probe-a-f2-regex-match-staging
      method: get
      path: /
      host: envoy-rust.test
      extra_headers:
        - [x-tier, "staging"]
      expected_status: 200
      expected_body: { kind: byte_exact, body: "ok\n" }
      expected_headers: set_equal_modulo_allow_list
    - name: probe-b-f2-regex-miss-dev
      method: get
      path: /
      host: envoy-rust.test
      extra_headers:
        - [x-tier, "dev"]
      expected_status: 403
      expected_body: { kind: byte_exact, body: "RBAC: access denied" }
      expected_headers: set_equal_modulo_allow_list
    - name: probe-c-f1-present-match
      method: get
      path: /
      host: envoy-rust.test
      extra_headers:
        - [x-present, "1"]
        - [x-tier, "dev"]
      expected_status: 200
      expected_body: { kind: byte_exact, body: "ok\n" }
      expected_headers: set_equal_modulo_allow_list
    - name: probe-d-f1-present-absent
      method: get
      path: /
      host: envoy-rust.test
      extra_headers:
        - [x-tier, "dev"]
      expected_status: 403
      expected_body: { kind: byte_exact, body: "RBAC: access denied" }
      expected_headers: set_equal_modulo_allow_list
