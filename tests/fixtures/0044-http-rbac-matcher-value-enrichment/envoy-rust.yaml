# Phase 36 envoy-rust counterpart. Identical HCM body modulo bind address
# (127.0.0.1 per the fixture-0043/0017 precedent) and the absent admin block +
# absent generate_request_id (envoy-rust never injects x-request-id and the
# harness does not probe admin for direct_response fixtures). The {{PORT}}
# token is substituted by the harness to a per-fixture-run kernel-ephemeral
# port. The static_resources HCM body is otherwise identical to the upstream
# side: same http_filters list ([header_to_metadata producer with TWO
# request_rules (x-tier->tier, x-present->present_probe), rbac consumer with
# the two ALLOW policies f2_regex + f1_present, router]), same route_config
# (single direct_response {status: 200, body: "ok\n"}), same stat_prefix, same
# codec_type: HTTP1, clusters: []. The safe_regex value uses the bare
# `{ regex: ... }` shape (envoy-rust's SafeRegex parser accepts only `regex`).
node:
  cluster: phase-36-cluster
  id: phase-36-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.header_to_metadata
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_to_metadata.v3.Config
                      request_rules:
                        - header: x-tier
                          on_header_present:
                            metadata_namespace: envoy.filters.http.header_to_metadata
                            key: tier
                        - header: x-present
                          on_header_present:
                            metadata_namespace: envoy.filters.http.header_to_metadata
                            key: present_probe
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "f2_regex":
                            permissions:
                              - metadata:
                                  filter: envoy.filters.http.header_to_metadata
                                  path:
                                    - key: tier
                                  value:
                                    string_match:
                                      safe_regex: { regex: "^(prod|staging)$" }
                            principals:
                              - any: true
                          "f1_present":
                            permissions:
                              - metadata:
                                  filter: envoy.filters.http.header_to_metadata
                                  path:
                                    - key: present_probe
                                  value:
                                    present_match: true
                            principals:
                              - any: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
