# Phase 36 differential acceptance fixture: RBAC matcher-VALUE enrichment.
# An H1 direct_response listener whose http_filters chain is
#   [envoy.filters.http.header_to_metadata, envoy.filters.http.rbac, envoy.filters.http.router]
# exercises BOTH phase-36 features against upstream Envoy v1.33.0:
#   F1 — `present_match` ValueMatcher on an RBAC `metadata` condition (match on
#        KEY PRESENCE; semantics `present && want`, ADR-0088 §A1).
#   F2 — `safe_regex` StringMatcher on an RBAC `metadata` value, compiled at
#        lowering time (closes carry-forward M35-1). ANCHORED pattern
#        ^(prod|staging)$ so envoy-rust's partial `is_match` == Envoy's RE2
#        full match (ADR-0088 §A3b; the unanchored gap is deferred M36-1).
# The header_to_metadata producer writes TWO leaves: x-tier -> tier (drives F2),
# x-present -> present_probe (drives F1). The rbac consumer (action: ALLOW) has
# TWO policies that are OR'd (any match -> ALLOW): f2_regex (metadata `tier`
# safe_regex) and f1_present (metadata `present_probe` present_match: true).
# Producer-before-consumer chain order is REQUIRED (the consumer reads what the
# producer wrote in the same decode pass).
#   probe a (F2 match):  x-tier: staging                 -> f2_regex match    -> 200 + "ok\n"
#   probe b (F2 miss):   x-tier: dev                     -> neither match     -> 403 + "RBAC: access denied"
#   probe c (F1 present):x-present: 1, x-tier: dev       -> f1_present match  -> 200 + "ok\n"
#   probe d (F1 absent): x-tier: dev (no x-present)      -> neither match     -> 403 + "RBAC: access denied"
# 403 body is "RBAC: access denied" (19 bytes, NO trailing newline) per ADR-0034.
# Per-side YAML asymmetry follows the fixture-0043/0017 precedent (admin/bind/
# generate_request_id on the upstream side; none on the envoy-rust side).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-36-cluster
  id: phase-36-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.header_to_metadata
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_to_metadata.v3.Config
                      request_rules:
                        - header: x-tier
                          on_header_present:
                            metadata_namespace: envoy.filters.http.header_to_metadata
                            key: tier
                        - header: x-present
                          on_header_present:
                            metadata_namespace: envoy.filters.http.header_to_metadata
                            key: present_probe
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "f2_regex":
                            permissions:
                              - metadata:
                                  filter: envoy.filters.http.header_to_metadata
                                  path:
                                    - key: tier
                                  value:
                                    string_match:
                                      safe_regex: { regex: "^(prod|staging)$" }
                            principals:
                              - any: true
                          "f1_present":
                            permissions:
                              - metadata:
                                  filter: envoy.filters.http.header_to_metadata
                                  path:
                                    - key: present_probe
                                  value:
                                    present_match: true
                            principals:
                              - any: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
