# Phase-24 envoy-rust counterpart. Identical HCM shape modulo bind address
# (127.0.0.1 for envoy-rust per the fixture-0017/0031 precedent) and the absent
# admin block (envoy-rust harness does not probe admin for this fixture). The
# {{PORT}} token is substituted by the harness.
#
# Per-side YAML asymmetry from upstream envoy.yaml:
#   - No admin block (envoy-rust parser/harness does not use it).
#   - bind 127.0.0.1:{{PORT}} instead of 0.0.0.0:{{PORT}}.
#   - No generate_request_id field (envoy-rust's HCM config does not model it;
#     envoy-rust does not inject x-request-id by default — no-op divergence).
#   - No request_headers_to_remove field (envoy-rust does not inject the Envoy
#     header suite, so stripping is a no-op; the parser rejects unknown fields).
#   - Cluster: {{BACKEND_HOST}} = 127.0.0.1 (host-local); no dns_lookup_family
#     (envoy-rust's cluster config does not model it).
#
# The HCM body — http_filters list (csrf, router), route_config, stat_prefix,
# codec_type, typed_per_filter_config (the CsrfPolicy with filter_enabled 100%
# + additional_origins exact: "additional.csrf.test") — is otherwise identical
# to envoy.yaml. Both proxies see byte-identical filter config + probe headers,
# so the 200/403 split is deterministic cross-proxy.
# References: ADR-0060 (phase-24 SPEC), ADR-0061 (phase-24 PLAN-write).
node:
  cluster: phase-24-cluster
  id: phase-24-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                          typed_per_filter_config:
                            envoy.filters.http.csrf:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                              filter_enabled:
                                default_value:
                                  numerator: 100
                                  denominator: HUNDRED
                              additional_origins:
                                - exact: "additional.csrf.test"
                http_filters:
                  - name: envoy.filters.http.csrf
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                      filter_enabled:
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} } }
