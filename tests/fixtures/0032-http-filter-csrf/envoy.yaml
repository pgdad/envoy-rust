# Phase-24 differential acceptance fixture: drive 5 sequential HTTP/1.1 requests
# through an HCM whose http_filters chain is
#   [envoy.filters.http.csrf, envoy.filters.http.router]
# with a CsrfPolicy attached via typed_per_filter_config to the single prefix "/"
# route (which proxies to a real http1-echo-server upstream cluster — per the
# L8 lock-in in ADR-0061: a valid CSRF modify-method request must reach a real
# upstream to yield a 200; direct_response does NOT engage the per-route filter
# config — the 0031-http-filter-cors / 0030-http-filter-jwt-authn pattern).
# Probes exercise the §6.2-verified CSRF behaviours:
#   1. post-same-origin   — POST + Origin == target authority → 200, echo body
#   2. post-evil-origin   — POST + disallowed Origin → 403, body "Invalid origin"
#   3. post-additional    — POST + Origin matching additional_origins → 200, echo
#   4. get-evil-safe      — GET + disallowed Origin (safe method) → 200, echo body
#   5. post-no-source     — POST + no Origin/Referer → 403, body "Invalid origin"
#
# CsrfPolicy attached to the route via typed_per_filter_config:
#   filter_enabled: { default_value: { numerator: 100, denominator: HUNDRED } }
#   additional_origins: [ exact: "additional.csrf.test" ]   (ADR-0061 L3:
#   the matcher is the SCHEME-STRIPPED host[:port] — the probe Origin
#   "http://additional.csrf.test" reduces via host_and_port() to
#   "additional.csrf.test", equal to the exact matcher).
#
# The filter-chain entry and the per-route override share the SAME message
# (envoy.extensions.filters.http.csrf.v3.CsrfPolicy — ADR-0061 L1). The
# filter-chain entry carries filter_enabled 100% (REQUIRED, no default); the
# per-route override re-states filter_enabled 100% and adds additional_origins.
#
# Per-side YAML asymmetry follows the fixture-0031/0008/0017 precedent:
#   - upstream side: admin block (port 0; kernel-ephemeral); bind
#     0.0.0.0:{{PORT}} (Docker container public bind);
#     generate_request_id: false (envoy-rust does not inject x-request-id);
#     request_headers_to_remove stripping the Envoy-injected upstream headers
#     (x-forwarded-for, x-forwarded-proto, x-request-id, etc.) so the
#     echo-server body is byte-equal across both proxies.
#   - envoy-rust side: no admin block; bind 127.0.0.1:{{PORT}}; neither
#     generate_request_id nor request_headers_to_remove (envoy-rust does not
#     inject those headers, so stripping is a no-op).
#
# Cluster shape: STRICT_DNS, dns_lookup_family: V4_ONLY (per 0008/0031);
#   upstream side: {{BACKEND_HOST}} = host.docker.internal (Docker → Mac host);
#   subject side:  {{BACKEND_HOST}} = 127.0.0.1.
# References: ADR-0060 (phase-24 SPEC), ADR-0061 (phase-24 PLAN-write).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-24-cluster
  id: phase-24-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  request_headers_to_remove:
                    - x-forwarded-for
                    - x-forwarded-proto
                    - x-request-id
                    - x-envoy-expected-rq-timeout-ms
                    - x-envoy-internal
                    - x-envoy-external-address
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                          typed_per_filter_config:
                            envoy.filters.http.csrf:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                              filter_enabled:
                                default_value:
                                  numerator: 100
                                  denominator: HUNDRED
                              additional_origins:
                                - exact: "additional.csrf.test"
                http_filters:
                  - name: envoy.filters.http.csrf
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                      filter_enabled:
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: {{BACKEND_HOST}}, port_value: {{HTTP1_BACKEND_PORT}} } }
