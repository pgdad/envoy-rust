# Phase 35 differential acceptance fixture: the FIRST dynamic-metadata CONSUMER.
# Drive 3 sequential GET / probes through an HCM whose http_filters chain is
#   [envoy.filters.http.header_to_metadata, envoy.filters.http.rbac, envoy.filters.http.router]
# The header_to_metadata producer extracts the `x-tier` request header into
# dynamic metadata `envoy.filters.http.header_to_metadata:tier`; the rbac
# consumer (action: ALLOW, one policy) requires that metadata to string-match
# "prod" via a `metadata` Permission. Producer-before-consumer chain order is
# REQUIRED (the consumer reads what the producer wrote in the same decode pass).
#   probe 1: x-tier: prod  -> metadata tier=prod -> ALLOW match -> 200 + "ok\n"
#   probe 2: x-tier: dev   -> metadata tier=dev  -> no match     -> 403 + "RBAC: access denied"
#   probe 3: (no x-tier)   -> key unset          -> no match     -> 403 + "RBAC: access denied"
# 403 body is "RBAC: access denied" (19 bytes, NO trailing newline) per ADR-0034.
# Per-side YAML asymmetry follows the fixture-0017 precedent (admin/bind/
# generate_request_id on the upstream side; none on the envoy-rust side).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-35-cluster
  id: phase-35-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.header_to_metadata
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_to_metadata.v3.Config
                      request_rules:
                        - header: x-tier
                          on_header_present:
                            metadata_namespace: envoy.filters.http.header_to_metadata
                            key: tier
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "tier_prod":
                            permissions:
                              - metadata:
                                  filter: envoy.filters.http.header_to_metadata
                                  path:
                                    - key: tier
                                  value:
                                    string_match: { exact: "prod" }
                            principals:
                              - any: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
