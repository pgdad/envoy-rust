# Phase 35 envoy-rust counterpart. Identical HCM body modulo bind address
# (127.0.0.1 for envoy-rust per the fixture-0017 precedent) and the absent
# admin block (envoy-rust harness does not probe admin for direct_response
# fixtures). NO generate_request_id line (envoy-rust never injects
# x-request-id). The {{PORT}} token is substituted by the harness to a
# per-fixture-run kernel-ephemeral port. The static_resources HCM body is
# identical to the upstream side: same http_filters list
# ([envoy.filters.http.header_to_metadata producer, envoy.filters.http.rbac
# consumer with the single ALLOW policy tier_prod, envoy.filters.http.router]),
# same route_config (single direct_response {status: 200, body: "ok\n"}),
# same stat_prefix: ingress_http, same codec_type: HTTP1, clusters: [].
node:
  cluster: phase-35-cluster
  id: phase-35-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.header_to_metadata
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_to_metadata.v3.Config
                      request_rules:
                        - header: x-tier
                          on_header_present:
                            metadata_namespace: envoy.filters.http.header_to_metadata
                            key: tier
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "tier_prod":
                            permissions:
                              - metadata:
                                  filter: envoy.filters.http.header_to_metadata
                                  path:
                                    - key: tier
                                  value:
                                    string_match: { exact: "prod" }
                            principals:
                              - any: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
