# Phase 10 envoy-rust counterpart. Identical shape modulo bind address
# (127.0.0.1 for envoy-rust per the fixture-0013/0016 precedent) and the
# absent admin block (envoy-rust harness does not probe admin for
# direct_response fixtures). The {{PORT}} token is substituted by the
# harness to a per-fixture-run kernel-ephemeral port. The static_resources
# HCM body is identical to the upstream side: same http_filters list
# ([envoy.filters.http.rbac with the single ALLOW policy pass_with_header,
# envoy.filters.http.router]), same route_config (single direct_response
# {status: 200, body: "ok\n"}), same stat_prefix: ingress_http, same
# codec_type: HTTP1, clusters: [].
node:
  cluster: phase-10-cluster
  id: phase-10-envoy-rust
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "pass_with_header":
                            permissions:
                              - any: true
                            principals:
                              - header:
                                  name: x-rbac-pass
                                  string_match: { exact: "yes" }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
