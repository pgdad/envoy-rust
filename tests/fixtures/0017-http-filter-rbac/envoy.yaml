# Phase 10 differential acceptance fixture: drive 4 sequential GET / requests
# through an HCM whose http_filters chain is
#   [envoy.filters.http.rbac, envoy.filters.http.router]
# with action: ALLOW + one policy "pass_with_header" requiring the
#   x-rbac-pass: yes
# header on the request. The policy uses an `any: true` permission paired
# with a `header` principal so the principal is the decision discriminator;
# probes alternate header presence + value to engage both the Allow-match
# (200 / "ok\n") and the Allow-no-match-default-Deny (403 /
# "RBAC: access denied") paths.
#
# Per upstream Envoy v1.33's envoy.extensions.filters.http.rbac.v3.RBAC,
# the filter denies any request that does not match a policy under
# action: ALLOW. Empirical 403 response shape (verified at phase-10
# state-2 PLAN-write via Docker run of envoyproxy/envoy:v1.33.0):
#   - status 403
#   - body bytes "RBAC: access denied" (19 bytes, NO trailing \n)
#   - 5 standard HTTP/1.1 response headers under harness Connection: close
#     framing: {content-length: 19, content-type: text/plain, date: ...,
#     server: envoy, connection: close}
#
# Per ADR-0034 (phase-10 state-2 §6.2 empirical-verification revision):
# the SPEC §2.2 projection of "RBAC: access denied\n" (20 bytes) was off
# by 1 byte; the actual upstream body is "RBAC: access denied" (19 bytes).
# envoy-rust matches this exact body via
# `Bytes::from_static(b"RBAC: access denied")` per phase-10 PLAN lock-in #14.
#
# This fixture is the FIRST non-LocalRateLimit bilateral consumer of the
# phase-09 H1 HCM `decorate_filter_synth_response` helper (landed at
# ADR-0033 Commit C `ae2cef0`). The 2 deny probes (statuses 1 + 3)
# engage the helper end-to-end; the 2 allow probes (statuses 2 + 4)
# pass through to the direct_response route.
#
# Per-side YAML asymmetry follows the fixture-0016 precedent:
#   - upstream side: admin block (port 0; kernel-ephemeral); bind
#     0.0.0.0:{{PORT}} (Docker container public bind);
#     generate_request_id: false (envoy-rust does not inject
#     x-request-id, so disable upstream injection for header-set parity).
#   - envoy-rust side: no admin block; bind 127.0.0.1:{{PORT}}
#     (subprocess on host).
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 0
node:
  cluster: phase-10-cluster
  id: phase-10-envoy
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          # {{PORT}} is harness-substituted to a per-fixture-run port (the
          # testcontainers container's CONTAINER_PORT is 10000 — the same
          # template emits the static value 10000 on the upstream side).
          address: 0.0.0.0
          port_value: {{PORT}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                generate_request_id: false
                route_config:
                  name: default
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok\n" }
                http_filters:
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "pass_with_header":
                            permissions:
                              - any: true
                            principals:
                              - header:
                                  name: x-rbac-pass
                                  # "yes" MUST be quoted; bare `yes` parses
                                  # as YAML boolean true and the RBAC
                                  # matcher requires the literal string.
                                  string_match: { exact: "yes" }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters: []
