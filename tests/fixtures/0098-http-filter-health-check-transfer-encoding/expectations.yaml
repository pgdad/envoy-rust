# Phase 115 (ADR-0204; phase-115 REVIEW-3.md I3-1 cell B7): TWO HTTP/1.1
# probes at a backend-free, CLUSTER-FREE HCM listener whose chain is
#   [health_check (:path exact /healthz),
#    header_mutation (response transfer-encoding: gzip, APPEND_IF_EXISTS_OR_ADD),
#    router]
#
#   p1  HEAD /healthz — the codec owns an H1 headers-only reply's
#       transfer-encoding: the mutation's `gzip` is replaced, and the reply
#       goes out `transfer-encoding: chunked` alone (MEASURED against
#       envoyproxy/envoy:v1.33.0). The driver reads a HEAD reply's head only;
#       `diff_headers` compares the `transfer-encoding` VALUE, which is what
#       discriminates.
#   p2  GET /healthz — the non-HEAD twin: `content-length: 0` alone, no
#       transfer-encoding, empty body.
#
# Why no /other probe: envoy-rust keeps a stage-written transfer-encoding on
# a reply that is NOT headers-only (CF-115-16 (d), pre-existing, not this
# filter's), so an /other probe would red on a divergence this phase does
# not own.
driver:
  kind: http1_probe_list
  probes:
    - name: p1-head-intercept-stage-te-replaced-by-chunked
      method: head
      path: "/healthz"
      host: "envoy-rust.test"
      expected_status: 200
      expected_body: { kind: byte_exact, body: "" }
      expected_headers: set_equal_modulo_allow_list
    - name: p2-get-intercept-stage-te-dropped
      method: get
      path: "/healthz"
      host: "envoy-rust.test"
      expected_status: 200
      expected_body: { kind: byte_exact, body: "" }
      expected_headers: set_equal_modulo_allow_list
