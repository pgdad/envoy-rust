# cargo-deny configuration for envoy-rust.
#
# Enforces doctrine rule D-3.2 ("Forbidden, without exception: GPL-licensed code")
# and doctrine rule D-3.6 ("Every phase is a green build") by failing CI on
# disallowed licenses or known security advisories in the dependency tree.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Ignored advisories. Each entry must be narrowly justified; see ADR-0005 for
# the discipline. Unscoped ignores are never allowed.
ignore = [
    # RUSTSEC-2025-0111 — tokio-tar 0.3.1 PAX extended header parsing allows
    # file smuggling (CVE-2025-62518). Path: differential → testcontainers
    # 0.23.3 → tokio-tar 0.3.1. Upstream tokio-tar is archived; "no safe
    # upgrade is available"; the testcontainers project tracks a migration to
    # `astral-tokio-tar`. Dev-only test harness; no production exposure.
    # See ADR-0005.
    { id = "RUSTSEC-2025-0111", reason = "dev-only testcontainers chain; no safe upgrade; tracked via ADR-0005" },
    # RUSTSEC-2025-0134 — rustls-pemfile unmaintained. Path: differential →
    # testcontainers → bollard → rustls-pemfile. Dev-only; upstream recommends
    # migrating to rustls-pki-types' PemObject trait, tracked at testcontainers
    # upstream. See ADR-0005.
    { id = "RUSTSEC-2025-0134", reason = "dev-only testcontainers chain; no safe upgrade; tracked via ADR-0005" },
]

[licenses]
version = 2
# Confidence threshold for detecting a license from source text.
confidence-threshold = 0.8
# Allow-list. If a crate's license is not in this list, the build fails.
# All GPL variants (GPL, LGPL, AGPL) are deliberately absent — see D-3.2.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
]
exceptions = []

[bans]
multiple-versions = "warn"
# Wildcard version specs (like "*" or "1.*") are denied. Path dependencies
# (workspace members without version specs) are exempted via allow-wildcard-paths,
# cargo-deny's targeted idiom for admitting path deps without broadening the
# wildcard denial rule. See ADR-0005 and ADR-0008 for envoy-config introduction.
wildcards = "deny"
allow-wildcard-paths = true
# Doctrine D-3.2 forbidden-dependency list. These are hard-denied at the
# workspace root; pulling them in as a direct dependency fails cargo-deny.
# Transitive pulls through permitted foundations are allowed via the
# `wrappers` field on each entry — cargo-deny fires the ban only when the
# crate's direct parent is NOT in the wrapper list. See ADR-0005 for why
# `wrappers` is used here instead of `skip-tree` (skip-tree only affects
# the multiple-versions check, not the denylist).
deny = [
    # hyper/hyper-util/tower-service leak in via bollard (a testcontainers
    # transitive). The wrapper list enumerates every direct parent in that
    # chain; non-wrapper parents still fire the ban. When later phases add
    # `tonic`, extend the wrapper lists and land a new ADR.
    { name = "hyper", wrappers = ["bollard", "hyper-named-pipe", "hyper-rustls", "hyper-util", "hyperlocal"] },
    { name = "hyper-util", wrappers = ["bollard", "hyper-named-pipe", "hyper-rustls", "hyperlocal"] },
    { name = "axum" },
    { name = "actix-web" },
    { name = "warp" },
    { name = "rocket" },
    { name = "poem" },
    { name = "pingora" },
    { name = "sozu" },
    { name = "tower" },
    { name = "tower-service", wrappers = ["bollard", "hyper-named-pipe", "hyper-rustls", "hyper-util", "hyperlocal"] },
    { name = "tower-http" },
]
# `skip` / `skip-tree` govern the `multiple-versions` check ONLY; they do NOT
# exempt banned crates (see ADR-0005). The testcontainers entry below keeps
# multi-version noise out of the warning stream for that subtree.
skip = []
skip-tree = [
    { name = "testcontainers" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
