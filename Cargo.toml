[workspace]
resolver = "2"
members = [
    "crates/envoy-accesslog",
    "crates/envoy-admin",
    "crates/envoy-bin",
    "crates/envoy-cluster",
    "crates/envoy-config",
    "crates/envoy-filter",
    "crates/envoy-health",
    "crates/envoy-jwt",
    "crates/envoy-http1",
    "crates/envoy-http2",
    "crates/envoy-listener",
    "crates/envoy-stats",
    "crates/envoy-tcp",
    "crates/envoy-tls",
    "tests/conformance/h2spec",
    "tests/differential",
    "tests/helpers/health-aware-http1-backend",
    "tests/helpers/helper-common",
    "tests/helpers/http1-echo-server",
    "tests/helpers/http2-echo-server",
    "tests/helpers/tcp-echo-server",
    "tests/helpers/tls-echo-server",
]
exclude = [
    "crates/envoy-accesslog/fuzz",
    "crates/envoy-config/fuzz",
    "crates/envoy-filter/fuzz",
    "crates/envoy-jwt/fuzz",
]

# Workspace members grow as later phases introduce crates. Phase 00 lands the
# binary (`crates/envoy-bin`) and the differential harness (`tests/differential`).

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Startup-only dependencies: optimize for size. Their code executes once at
# boot (config parse, tracing/env-filter setup) but the touched pages stay
# resident for the process lifetime — smaller text directly cuts RSS.
[profile.release.package.serde_yaml]
opt-level = "z"
[profile.release.package.unsafe-libyaml]
opt-level = "z"
[profile.release.package.tracing-subscriber]
opt-level = "z"
[profile.release.package.matchers]
opt-level = "z"
[profile.release.package.regex]
opt-level = "z"
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.regex-syntax]
opt-level = "z"
